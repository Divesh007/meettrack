<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTF MeetTrack</title>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;font-size:14px;color:#1a1a2e;min-height:100vh}
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;border:none;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-or{background:#e8600a;color:#fff}.btn-nv{background:#0f1535;color:#fff}
.btn-gr{background:#16a34a;color:#fff}.btn-rd{background:#dc2626;color:#fff}
.btn-gy{background:#6b7280;color:#fff}.btn-bl{background:#2563eb;color:#fff}
.btn-pu{background:#7c3aed;color:#fff}
.btn-sm{padding:6px 12px!important;font-size:12px!important}
.btn-xs{padding:4px 9px!important;font-size:11px!important}
.btn-full{width:100%;justify-content:center;padding:13px 16px;font-size:14px}
/* AUTH */
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0f2e,#0f1535);padding:20px}
.auth-box{background:#fff;border-radius:16px;padding:36px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.auth-brand{text-align:center;margin-bottom:24px}
.auth-ntf{font-size:11px;font-weight:700;letter-spacing:3px;color:#e8600a;text-transform:uppercase;margin-bottom:6px}
.auth-logo{font-size:30px;font-weight:700;color:#0f1535}
.auth-logo span{color:#e8600a}
.auth-sub{font-size:13px;color:#888;margin-top:4px}
.role-tabs{display:flex;gap:4px;background:#f5f5f5;padding:4px;border-radius:10px;margin-bottom:20px}
.role-tab{flex:1;padding:9px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:#666;font-family:inherit;transition:all .15s}
.role-tab.active{background:#0f1535;color:#fff;font-weight:700}
.hint{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 13px;font-size:12px;color:#1e40af;margin-bottom:16px;line-height:1.7}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:11px;font-weight:700;color:#374151;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.auth-field input{width:100%;padding:11px 13px;border:2px solid #e5e7eb;border-radius:9px;background:#f9fafb;color:#111;font-size:14px;font-family:inherit}
.auth-field input:focus{outline:none;border-color:#0f1535;background:#fff}
.auth-err{background:#fff5f5;border:1px solid #fca5a5;color:#991b1b;font-size:12px;padding:10px 13px;border-radius:8px;margin-bottom:14px}
.auth-link{text-align:center;font-size:13px;color:#777;margin-top:14px}
.auth-link span{color:#e8600a;cursor:pointer;font-weight:700;text-decoration:underline}
/* LAYOUT */
.app-layout{display:flex;min-height:100vh}
.sidebar{width:210px;background:#0f1535;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:50}
.sb-brand{padding:18px 14px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-ntf{font-size:9px;font-weight:700;letter-spacing:2.5px;color:#e8600a;text-transform:uppercase;margin-bottom:4px}
.sb-name{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.3px}
.sb-name span{color:#e8600a}
.sb-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px}
.sb-section{font-size:9px;font-weight:700;color:rgba(255,255,255,.3);padding:12px 14px 3px;text-transform:uppercase;letter-spacing:1.5px}
.nav-item{padding:10px 14px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.55);border-left:3px solid transparent;display:flex;align-items:center;gap:9px;font-weight:500;transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(232,96,10,.15);color:#fff;border-left-color:#e8600a;font-weight:600}
.sb-user{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:9px}
.sb-av{width:34px;height:34px;border-radius:9px;background:#e8600a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.sb-uname{font-size:12px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-urole{font-size:10px;color:rgba(255,255,255,.4);text-transform:capitalize}
.sb-logout{width:28px;height:28px;background:rgba(255,255,255,.1);border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.4);font-size:16px;flex-shrink:0;border:none}
.sb-logout:hover{background:rgba(255,255,255,.2);color:#fff}
.main-content{flex:1;margin-left:210px;padding:28px;background:#f0f2f5;min-height:100vh}
/* COMMON */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-size:24px;font-weight:700;color:#0f1535;letter-spacing:-.3px}
.page-sub{font-size:13px;color:#888;margin-top:4px}
.back-link{display:inline-flex;align-items:center;gap:6px;color:#e8600a;cursor:pointer;font-weight:600;font-size:13px;margin-bottom:16px;padding:7px 14px;background:#fff7ed;border-radius:8px;border:1px solid #fed7aa}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:#0f1535;text-transform:uppercase;letter-spacing:.6px}
.card-label::before{content:'';width:3px;height:14px;background:#e8600a;border-radius:2px;flex-shrink:0}
.inp{width:100%;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:8px;background:#f9fafb;color:#111;font-size:13px;font-family:inherit;transition:border-color .2s}
.inp:focus{outline:none;border-color:#0f1535;background:#fff}
select.inp{cursor:pointer}
textarea.inp{resize:none;line-height:1.5}
/* BADGES */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.b-pending{background:#fefce8;color:#854d0e;border:1px solid #fde68a}
.b-ongoing{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.b-completed{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.b-internal{background:#f5f3ff;color:#5b21b6;border:1px solid #ddd6fe}
.b-external{background:#fdf4ff;color:#7e22ce;border:1px solid #e9d5ff}
.b-emp{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;font-size:10px;padding:1px 7px}
.b-ov{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.b-mine{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
/* STATS */
.stats-row{display:grid;gap:12px;margin-bottom:20px}
.stats-4{grid-template-columns:repeat(4,1fr)}
.stat-box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-num{font-size:26px;font-weight:700;color:#0f1535;letter-spacing:-.5px}
.stat-text{font-size:12px;color:#888;margin-top:3px}
/* HOME */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;max-width:600px}
.home-card{background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:20px;cursor:pointer;transition:all .2s}
.home-card:hover{border-color:#e8600a;transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,96,10,.1)}
/* TEAMS */
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.team-card{background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:16px;cursor:pointer;transition:all .15s;position:relative}
.team-card:hover{border-color:#e8600a}
.team-card-actions{position:absolute;top:8px;right:8px;display:none;gap:4px}
.team-card:hover .team-card-actions{display:flex}
/* MEETING LIST */
.mtg-list-item{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .15s;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.mtg-list-item:hover{border-color:#e8600a;box-shadow:0 4px 12px rgba(232,96,10,.1)}
.mtg-icon{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#e8600a,#f09040);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
/* ATTENDEES */
.pills-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:30px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:20px;font-size:12px;font-weight:500}
.pill-x{cursor:pointer;color:#9ca3af;font-weight:700;font-size:13px;line-height:1;margin-left:2px}
.pill-x:hover{color:#dc2626}
/* MINUTES */
.min-item{background:#fff;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px;overflow:hidden}
.min-header{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer}
.min-num{font-size:11px;font-weight:700;color:#e8600a;min-width:20px;flex-shrink:0;margin-top:1px}
.min-text{flex:1;font-size:13px;line-height:1.5;color:#111;font-weight:500}
.min-type-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;flex-shrink:0}
.min-note{background:#f1f5f9;color:#475569}
.min-task{background:#fff7ed;color:#c2410c}
.min-body{padding:0 14px 12px;border-top:1px solid #f3f4f6;margin-top:0}
.min-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.attachment-link{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;font-size:11px;color:#1e40af;text-decoration:none;font-weight:600}
.attachment-link:hover{background:#dbeafe}
/* TASKS */
.task-box{background:#fff;border:1px solid #e5e7eb;border-left:4px solid #cbd5e1;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.task-box.mine{border-left-color:#16a34a;background:#f9fffe}
.task-box.overdue{border-left-color:#dc2626;background:#fff9f9}
.task-tags{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.task-desc{font-size:13px;color:#374151;line-height:1.5;margin-bottom:13px;padding:10px 13px;background:#f8fafc;border-radius:8px;border-left:3px solid #e8600a;font-weight:500}
.task-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.field-label{font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.task-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid #f3f4f6;align-items:center}
.task-note{font-size:11px;color:#555;padding:7px 11px;background:#f8fafc;border-radius:7px;margin-top:6px;border-left:2px solid #e8600a;line-height:1.4}
/* CLIENTS */
.client-row{background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .15s;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.client-row:hover{border-color:#e8600a}
.client-av{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#e8600a,#f09040);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
/* MY TASKS */
.task-filter-tabs{display:flex;gap:8px;margin-bottom:18px}
.tftab{padding:8px 20px;border:2px solid #e5e7eb;border-radius:20px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#555;font-family:inherit;transition:all .15s}
.tftab.on{background:#0f1535;color:#fff;border-color:#0f1535}
.tftab.or.on{background:#e8600a;border-color:#e8600a}
.tftab.gr.on{background:#16a34a;border-color:#16a34a}
.section-heading{font-size:12px;font-weight:700;color:#0f1535;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 10px;padding-bottom:7px;border-bottom:2px solid #e5e7eb}
/* DASHBOARD */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-chip{padding:6px 16px;border:2px solid #e5e7eb;border-radius:20px;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#555;font-family:inherit;transition:all .15s}
.filter-chip.active{background:#0f1535;color:#fff;border-color:#0f1535}
.table-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
table{width:100%;border-collapse:collapse}
th{padding:11px 13px;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;background:#f9fafb;border-bottom:1px solid #f3f4f6;text-align:left;letter-spacing:.5px}
td{padding:11px 13px;border-bottom:1px solid #f9fafb;font-size:12px;color:#111;vertical-align:middle}
tr:last-child td{border:none}
tr:hover td{background:#fafafa}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,40,.65);display:flex;align-items:center;justify-content:center;z-index:9999}
.modal-card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:440px;box-shadow:0 24px 64px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:700;color:#0f1535;margin-bottom:16px}
.modal-field{margin-bottom:13px}
.modal-field label{display:block;font-size:11px;font-weight:700;color:#374151;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.modal-actions{display:flex;gap:9px;margin-top:18px;justify-content:flex-end}
/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:11px;font-size:13px;font-weight:600;z-index:99999;animation:toastIn .2s ease;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px}
.toast-ok{background:#166534}.toast-err{background:#991b1b}.toast-inf{background:#1e40af}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0f1535}
.loader{width:40px;height:40px;border:4px solid rgba(232,96,10,.2);border-top-color:#e8600a;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* UPLOAD */
.file-upload-area{border:2px dashed #e5e7eb;border-radius:8px;padding:12px 16px;text-align:center;cursor:pointer;transition:all .15s;background:#f9fafb}
.file-upload-area:hover{border-color:#e8600a;background:#fff7ed}
.file-upload-area input{display:none}
/* VIEW ONLY */
.view-only-banner{background:#fefce8;border:1px solid #fde68a;border-radius:8px;padding:8px 14px;font-size:12px;color:#854d0e;margin-bottom:12px;font-weight:600;display:flex;align-items:center;gap:6px}
/* SEARCH */
.sb-search{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-search input{width:100%;padding:7px 10px;border-radius:8px;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-family:inherit;outline:none}
.sb-search input::placeholder{color:rgba(255,255,255,.35)}
.search-overlay{position:fixed;top:0;left:210px;right:0;bottom:0;z-index:200;background:rgba(10,14,40,.45)}
.search-box{background:#fff;border-radius:14px;margin:60px auto;max-width:560px;max-height:72vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.search-res-item{padding:12px 16px;border-bottom:1px solid #f3f4f6;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.search-res-item:hover{background:#fafafa}
.search-res-item:last-child{border:none}
/* DEADLINE POPUP */
.dl-popup-bg{position:fixed;inset:0;background:rgba(10,14,40,.65);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.dl-popup{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:500px;box-shadow:0 24px 64px rgba(0,0,0,.3);max-height:85vh;overflow-y:auto}
.dl-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f3f4f6}
.dl-row:last-child{border:none}
/* STATUS */
.b-scheduled{background:#f0f9ff;color:#075985;border:1px solid #bae6fd}
.b-s-ongoing{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.b-s-completed{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.b-s-cancelled{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5}
/* CHART */
.chart-wrap{position:relative;height:260px;margin-top:10px}
/* PERFORMANCE */
.perf-emp-card{background:#fff;border:1.5px solid #e5e7eb;border-radius:14px;padding:18px 20px;margin-bottom:12px;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.perf-emp-card:hover{border-color:#e8600a;box-shadow:0 4px 14px rgba(232,96,10,.1)}
.perf-emp-card.selected{border-color:#e8600a;background:#fff7ed}
.perf-rate-bar{height:8px;background:#f3f4f6;border-radius:10px;overflow:hidden;flex:1}
.perf-rate-fill{height:100%;border-radius:10px;transition:width .4s ease}
.emp-detail-panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.perf-search-wrap{position:relative;margin-bottom:16px}
.perf-search-wrap span{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none}
.perf-search-bar{background:#fff;border:1.5px solid #e5e7eb;border-radius:10px;padding:9px 14px 9px 36px;font-size:13px;font-family:inherit;color:#111;width:100%;outline:none;transition:border-color .2s}
.perf-search-bar:focus{border-color:#e8600a}{.sidebar,.btn,.back-link,.task-actions,.team-card-actions,.filter-bar,.page-head .btn,.min-actions{display:none!important}.main-content{margin-left:0!important}}
</style>
</head>
<body>
<div id="root">
  <div class="loading-screen">
    <div class="loader"></div>
    <div style="color:rgba(255,255,255,.5);font-size:14px">Loading NTF MeetTrack...</div>
  </div>
</div>
<script>
// ── FIREBASE CONFIG ─────────────────────────────
var firebaseConfig = {
  apiKey: "AIzaSyAlr2Rn4cGBKfMM9mcgKJ3H9rj9tPW5kD0",
  authDomain: "meettrack-1bd7e.firebaseapp.com",
  projectId: "meettrack-1bd7e",
  storageBucket: "meettrack-1bd7e.firebasestorage.app",
  messagingSenderId: "199366587854",
  appId: "1:199366587854:web:3a94a783f60a6e28fbe79f"
};
firebase.initializeApp(firebaseConfig);
var auth    = firebase.auth();
var db      = firebase.firestore();


// ── STATE ───────────────────────────────────────
// ── DIRECTOR SECRET CODE ── Change this to your own code ──
var DIRECTOR_SECRET_CODE = 'NTF@Director2026'; // ← CHANGE THIS ANYTIME

var ST = {
  page:'loading', subPage:'teams', user:null, profile:null,
  aMode:'login', aRole:'employee', aErr:'',
  allUsers:[], teams:[], clients:[], meetings:[],
  cur:null, curTeamId:null, curClientId:null,
  dFil:'all', dPer:'monthly', dTeam:'all', dStatus:'all', myTaskFilter:'all', perfSearch:'', perfSelectedEmp:'', perfPer:'overall'
};

// ── HELPERS ─────────────────────────────────────
function ini(n){ return (n||'?').split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2); }
function today(){ return new Date().toISOString().split('T')[0]; }
function fmtD(d){ if(!d) return 'Not set'; try{ return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return d; } }
function isOv(d,s){ return d && s!=='completed' && new Date(d) < new Date(); }
function isLateCompleted(t){ return t && t.status==='completed' && t.deadline && t.completedAt && t.completedAt > t.deadline; }
function wasLate(t){ return t && t.status==='completed' && t.completedLate===true; }
function canM(){ return ST.profile && (ST.profile.role==='director'||ST.profile.role==='boss'); } // boss kept for backward compat with existing accounts
function canEditMeeting(m){ return m && (m.createdByUid===ST.user.uid || canM()); }

function toast(msg, type){
  type = type||'inf';
  document.querySelectorAll('.toast').forEach(function(t){ t.remove(); });
  var el = document.createElement('div');
  el.className = 'toast toast-'+type;
  el.innerHTML = (type==='ok'?'✓':type==='err'?'✕':'ℹ')+' '+msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3000);
}
// ── BASE64 FILE UPLOAD (no Firebase Storage needed) ──
function uploadFile(file){
  return new Promise(function(resolve,reject){
    if(file.size>900000){reject(new Error('Max 900KB per file'));return;}
    var r=new FileReader();
    r.onload=function(e){resolve(e.target.result);};
    r.onerror=function(){reject(new Error('Could not read file'));};
    r.readAsDataURL(file);
  });
}
function downloadFile(url,name){

  } else {
    var a=document.createElement('a');a.href=url;a.download=name||'file';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  }
}
// Email preference - stored in localStorage
function getMailPref(){ return localStorage.getItem('ntf_mail_pref')||'outlook'; }
function setMailPref(p){ localStorage.setItem('ntf_mail_pref',p); }

function openGmail(to, subject, body){
  var pref=getMailPref();
  if(pref==='gmail'){
    window.open('https://mail.google.com/mail/?view=cm&to='+encodeURIComponent(to)+'&su='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body),'_blank');
  } else if(pref==='outlook'){
    // Outlook Web (works for both Outlook.com and Office 365)
    window.open('https://outlook.office.com/mail/deeplink/compose?to='+encodeURIComponent(to)+'&subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body.replace(/\n/g,'<br>')),'_blank');
  } else {
    // mailto: opens default mail app (Outlook desktop, Apple Mail, etc.)
    window.location.href='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  }
}

// ── FIREBASE ────────────────────────────────────
function loadAll(){ return Promise.all([loadUsers(),loadTeams(),loadClients(),loadMeetings()]); }

function loadUsers(){
  return db.collection('users').get().then(function(snap){
    ST.allUsers = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
  });
}
function loadTeams(){
  return db.collection('teams').get().then(function(snap){
    ST.teams = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
    if(!ST.teams.length) return seedTeams();
  });
}
function seedTeams(){
  var defs=[{name:'HR',icon:'👥'},{name:'Tech',icon:'💻'},{name:'Operations',icon:'⚙️'},{name:'Marketing',icon:'📣'},{name:'Finance',icon:'💰'},{name:'Legal',icon:'⚖️'}];
  return Promise.all(defs.map(function(t){
    return db.collection('teams').add(t).then(function(r){ ST.teams.push(Object.assign({id:r.id},t)); });
  }));
}
function loadClients(){
  return db.collection('clients').get().then(function(snap){
    ST.clients = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
  });
}
function loadMeetings(){
  return db.collection('meetings').orderBy('createdAt','desc').get().then(function(snap){
    var all=snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
    ST.meetings=filterMeetingsForUser(all);
  }).catch(function(){
    return db.collection('meetings').get().then(function(snap){
      var all=snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
      ST.meetings=filterMeetingsForUser(all);
    });
  });
}

// Director & boss see all meetings.
// Employees only see meetings where they are the creator OR listed as an attendee.
function filterMeetingsForUser(all){
  if(!ST.profile||!ST.user) return all;
  if(ST.profile.role==='director'||ST.profile.role==='boss') return all;
  var myEmail=ST.profile.email;
  var myUid=ST.user.uid;
  return all.filter(function(m){
    if(m.createdByUid===myUid) return true;
    return (m.attendees||[]).some(function(a){ return a.email===myEmail; });
  });
}
function saveMeeting(m){
  var data = JSON.parse(JSON.stringify(m));
  var id = data.id; delete data.id;
  if(id){
    return db.collection('meetings').doc(id).update(data).then(function(){
      m.id=id;
      var idx=ST.meetings.findIndex(function(x){return x.id===id;});
      if(idx!==-1) ST.meetings[idx]=JSON.parse(JSON.stringify(m));
    }).catch(function(){
      return db.collection('meetings').doc(id).set(data).then(function(){ m.id=id; });
    });
  } else {
    data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    return db.collection('meetings').add(data).then(function(r){
      m.id=r.id;
      ST.meetings.unshift(JSON.parse(JSON.stringify(m)));
    });
  }
}
function uploadFile(file, path){
  // Store as base64 in Firestore - no Firebase Storage needed
  return new Promise(function(resolve, reject){
    if(file.size > 900000){
      reject(new Error('File too large. Max size is 900KB. Use a smaller file.'));
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e){
      // Returns base64 data URL - works as download/view link directly
      resolve(e.target.result);
    };
    reader.onerror = function(){ reject(new Error('Could not read file')); };
    reader.readAsDataURL(file);
  });
}

// Download or view a base64 file
// Global handler for attachment buttons (avoids quote issues in onclick)
window._dlAtt = function(btn){
  var url = decodeURIComponent(btn.getAttribute('data-url')||'');
  var name = decodeURIComponent(btn.getAttribute('data-name')||'attachment');
  downloadFile(url, name);
};

function downloadFile(url, name){
  if(!url) return;
  if(url.startsWith('data:image')){
    // Open images in new tab
    var w = window.open('','_blank');
    if(w) w.document.write('<html><head><title>'+name+'</title></head><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="'+url+'" style="max-width:100%;max-height:100vh;object-fit:contain"></body></html>');
  } else {
    // Download other files (PDF, Excel, Word etc)
    var a = document.createElement('a');
    a.href = url;
    a.download = name || 'attachment';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}

var authTimeout = setTimeout(function(){
  if(ST.page==='loading'){ ST.page='auth'; render(); }
},2500);

auth.onAuthStateChanged(function(user){
  clearTimeout(authTimeout);
  if(user){
    ST.user=user;
    db.collection('users').doc(user.uid).get().then(function(snap){
      if(!snap.exists){ auth.signOut(); ST.page='auth'; render(); return; }
      ST.profile=Object.assign({id:snap.id},snap.data());
      return loadAll();
    }).then(function(){ ST.page='home'; render(); setTimeout(checkDeadlines,800); })
    .catch(function(e){ ST.page='auth'; ST.aErr='Connection error: '+e.message; render(); });
  } else {
    ST.user=null; ST.profile=null; ST.page='auth'; render();
  }
});

window.switchAuth=function(){ST.aMode=ST.aMode==='login'?'register':'login';ST.aErr='';render();};
window.doAuth=function(){
  var email=(document.getElementById('a-email')||{}).value||'';
  var pass=(document.getElementById('a-pass')||{}).value||'';
  email=email.trim();
  var btn=document.querySelector('.btn-full');
  if(btn){btn.disabled=true;btn.textContent='Please wait...';}
  if(ST.aMode==='login'){
    auth.signInWithEmailAndPassword(email,pass).then(function(cred){
      return db.collection('users').doc(cred.user.uid).get().then(function(snap){
        if(!snap.exists||snap.data().role!==ST.aRole){
          return auth.signOut().then(function(){ST.aErr='No '+ST.aRole+' account found. Check role or credentials.';render();});
        }
      });
    }).catch(function(e){
      ST.aErr=e.code==='auth/user-not-found'?'Account not found':e.code==='auth/wrong-password'?'Incorrect password':e.code==='auth/invalid-credential'?'Invalid email or password':e.code==='auth/too-many-requests'?'Too many attempts. Try later.':e.message;
      render();
    });
  } else {
    var nameEl=document.getElementById('a-name');
    var name=nameEl?nameEl.value.trim():'';
    if(!name){ST.aErr='Enter your full name';render();return;}
    // Director secret code check
    if(ST.aRole==='director'){
      var codeEl=document.getElementById('a-code');
      var code=codeEl?codeEl.value.trim():'';
      if(code!==DIRECTOR_SECRET_CODE){ST.aErr='Invalid director access code. Contact your admin.';render();return;}
    }
    auth.createUserWithEmailAndPassword(email,pass).then(function(cred){
      var newRole = ST.aRole === 'director' ? 'director' : 'employee';
      return db.collection('users').doc(cred.user.uid).set({name:name,email:email,role:newRole,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    }).catch(function(e){
      ST.aErr=e.code==='auth/email-already-in-use'?'Email already registered':e.code==='auth/weak-password'?'Password must be 6+ chars':e.message;
      render();
    });
  }
};

    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">'+

    '<option value="completed"'+(t.status==='completed'?' selected':'')+'>Completed</option>'+

      '<div style="padding:8px 12px;background:#f1f5f9;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between">'+

      '</div>'+

        return '<div style="padding:10px 14px;border-bottom:1px solid #f3f4f6;background:'+(isFirst?'#fff7ed':'#fff')+'">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">'+
        '<span style="font-size:12px;font-weight:700;color:#0f1535">'+log.by+'</span>'+
        '<span style="font-size:10px;color:#9ca3af">'+log.at+'</span>'+
        '<span class="badge '+(log.status==='pending'?'b-pending':log.status==='ongoing'?'b-ongoing':'b-completed')+'" style="font-size:9px">'+log.status+'</span>'+
        (log.deadlineChanged?'<span style="font-size:10px;color:#d97706;font-weight:600">📅 '+log.deadlineChanged+'</span>':'')+

    '<div class="field-label" style="margin-bottom:5px">📎 Attach Proof / Evidence</div>'+

    '<button class="btn btn-or btn-sm" onclick="saveMyTask(\''+t.mid+'\','+t.mi+')">💾 Save Status & Proof</button>'+

    '</div>'+
    '</div>';
  }

  var pend=all.filter(function(t){return t.status==='pending';});
  var ong=all.filter(function(t){return t.status==='ongoing';});
  var comp=all.filter(function(t){return t.status==='completed';});

  // Build team/client list for filter
  var teamNames=ST.teams.map(function(t){return t.name;});
  var clientNames=ST.clients.map(function(c){return c.name;});
  var allTeams=['all'].concat(teamNames).concat(clientNames);
  return '<div class="page-head"><div><div class="page-title">My Tasks</div><div class="page-sub">All tasks assigned to you</div></div></div>'+
  '<div class="task-filter-tabs">'+
  '<button class="tftab'+(filt==='all'?' on':'')+'" onclick="setMyTaskFilter(\'all\')">All ('+all.length+')</button>'+
  '<button class="tftab or'+(filt==='pending'?' on':'')+'" onclick="setMyTaskFilter(\'pending\')">⏳ Pending ('+pend.length+')</button>'+

  '<button class="tftab gr'+(filt==='completed'?' on':'')+'" onclick="setMyTaskFilter(\'completed\')">✅ Completed ('+comp.length+')</button>'+

  (filtered.length===0?

  '<div style="font-size:52px;margin-bottom:14px">🎯</div>'+
  '<div style="font-size:16px;font-weight:600;color:#374151;margin-bottom:5px">No tasks in this category</div>'+
  '</div>':
  filtered.map(tCard).join(''));
}

// Send Gmail for task in meeting room
window.sendTaskGmail = function(minIdx){
  var m = ST.cur;
  if(!m) return;
  var mn = m.minutes[minIdx];
  if(!mn||!mn.task||!mn.task.assigneeEmail){ toast('No assignee on this task','err'); return; }
  var t = mn.task;
  var ref = m.meetingName||(m.type==='internal'?m.teamName:m.clientName)||'Meeting';
  var subject = '[NTF MeetTrack] Task Assigned — '+ref;
  var body = 'Dear '+t.assignee+',\n\nYou have been assigned a task:\n\nMeeting: '+ref+'\nDate: '+m.date+'\n\nTask:\n'+mn.text+'\n\nDeadline: '+fmtD(t.deadline)+'\nStatus: '+t.status+'\nAssigned by: '+ST.profile.name+'\n\nPlease log in to NTF MeetTrack to update your task status.\n\nRegards,\n'+ST.profile.name+'\nNTF India';
  showMailPicker(t.assigneeEmail, subject, body);
  toast('Opening Gmail for '+t.assignee+'...','ok');
};

// Send Gmail update from My Tasks page
window.sendMyUpdateGmail = function(mid, mi){

  var t = mn.task;
  var ref = m.meetingName||(m.type==='internal'?m.teamName:m.clientName)||'Meeting';

};

function dashPage(){
  var ms=ST.meetings.slice();

  if(ST.dPer==='daily'){var t=today();ms=ms.filter(function(m){return m.date===t;});}
  else if(ST.dPer==='weekly'){var w=new Date();w.setDate(w.getDate()-7);ms=ms.filter(function(m){return new Date(m.date)>=w;});}

  // Collect all tasks from minutes
  var at=[];
  ms.forEach(function(m){
    (m.minutes||[]).forEach(function(mn){
      if(mn.type==='assign'&&mn.task){
        at.push(Object.assign({},mn.task,{ref:m.type==='internal'?m.teamName:m.clientName,mid:m.id,meetingName:m.meetingName||'Untitled'}));
      }

// New Meeting
window.newMeeting=function(){
  showModal('New Meeting',[
    {k:'meetingName',l:'Meeting Name',ph:'e.g. Weekly Sync, Sprint Review'}
  ],'Create Meeting',function(v){
    if(!v.meetingName){toast('Enter meeting name','err');return;}
    var isI=ST.page==='meetlist-int';
    var m;
    if(isI){
      var team=ST.teams.find(function(t){return t.id===ST.curTeamId;});
      m={type:'internal',teamId:team.id,teamName:team.name,meetingName:v.meetingName,
         date:today(),attendees:[{name:ST.profile.name,email:ST.profile.email}],
         minutes:[],tasks:[],createdBy:ST.profile.name,createdByUid:ST.user.uid};
    } else {
      var cl=ST.clients.find(function(c){return c.id===ST.curClientId;});
      m={type:'external',clientId:cl.id,clientName:cl.name,clientContact:cl.contact,
         meetingName:v.meetingName,date:today(),
         attendees:[{name:ST.profile.name,email:ST.profile.email}],
         minutes:[],tasks:[],createdBy:ST.profile.name,createdByUid:ST.user.uid};
    }
    saveMeeting(m).then(function(){
      ST.cur=m; ST.page='meeting'; render();
      toast('Meeting "'+v.meetingName+'" created!','ok');
    });
  });
};

// Add Minute
window.addMinute=function(){
  var text=(document.getElementById('min-input')||{}).value||'';
  text=text.trim();
  if(!text){toast('Type the minute text first','err');return;}
  var typeEl=document.querySelector('input[name="mintype"]:checked');
  var type=typeEl?typeEl.value:'note';
  var fileInput=document.getElementById('min-file');
  var file=fileInput&&fileInput.files[0]?fileInput.files[0]:null;

  var minObj={text:text,type:type,createdBy:ST.profile.name,createdByUid:ST.user.uid};

  if(type==='assign'){
    var asel=document.getElementById('min-assignee');
    var dsel=document.getElementById('min-deadline');
    var ssel=document.getElementById('min-status');
    var assigneeEmail=asel?asel.value:'';
    var assigneeName=asel&&asel.selectedIndex>0?asel.options[asel.selectedIndex].text:'';
    var deadline=dsel?dsel.value:''; var statusVal=ssel?ssel.value:'pending';
    // Read from checkboxes (new UI)
    var cbChecked=Array.from(document.querySelectorAll('.att-cb:checked'));
    var selectedOpts=cbChecked.length>0
      ? cbChecked.map(function(cb){return {value:cb.value,text:cb.getAttribute('data-name')};})
      : (asel?Array.from(asel.selectedOptions).filter(function(o){return o.value;}):[]);
    if(!selectedOpts.length){toast('Select at least one person to assign','err');return;}
    var createdAt=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    if(selectedOpts.length>1){
      selectedOpts.forEach(function(opt){
        var mn2={text:text,type:'assign',addedBy:ST.profile.name,addedAt:today(),attachmentUrl:'',attachmentName:''};
        mn2.task={assignee:opt.text,assigneeEmail:opt.value,deadline:deadline,status:statusVal,lastUpdatedBy:'',lastComment:'',updateLog:[{status:statusVal,comment:'Task created',by:ST.profile.name,at:createdAt}]};
        if(!ST.cur.minutes) ST.cur.minutes=[];
        ST.cur.minutes.push(mn2);
      });
      saveMeeting(ST.cur).then(function(){
        toast('Task assigned to '+selectedOpts.length+' people! ✅','ok');
        document.querySelectorAll('.modal-bg').forEach(function(m){m.remove();});
        render();
      }).catch(function(e){toast('Error: '+e.message,'err');}); return;
    }
    var assigneeEmail=selectedOpts[0].value; var assigneeName=selectedOpts[0].text;
    minObj.task={assignee:assigneeName,assigneeEmail:assigneeEmail,deadline:deadline,status:statusVal,lastUpdatedBy:'',lastComment:'',updateLog:[{status:statusVal,comment:'Task created',by:ST.profile.name,at:createdAt}]};
  }

  function doSave(url,name){
    if(url){minObj.attachmentUrl=url;minObj.attachmentName=name;}
    if(!ST.cur.minutes) ST.cur.minutes=[];
    ST.cur.minutes.push(minObj);
    saveMeeting(ST.cur).then(function(){toast('Minute added!','ok');render();});
  }

  if(file){
    toast('Processing file...','inf');
    uploadFile(file).then(function(url){doSave(url,file.name);}).catch(function(e){toast(e.message,'err');});
  } else {
    doSave(null,null);
  }
};

// Save My Task
window.saveMyTask=function(mid,mi){
  var m=ST.meetings.find(function(x){return x.id===mid;}); if(!m) return;
  var ss=document.getElementById('mts-'+mid+'-'+mi);
  var cs=document.getElementById('mtc-'+mid+'-'+mi);
  var fileInput=document.getElementById('proof-'+mid+'-'+mi);
  var file=fileInput&&fileInput.files[0]?fileInput.files[0]:null;
  var prevStatus=m.minutes[mi].task.status;
  m.minutes[mi].task.status=ss.value;
  var newComment=cs&&cs.value.trim()?cs.value.trim():'';
  // Always keep lastComment as latest for backwards compat
  if(newComment) m.minutes[mi].task.lastComment=newComment;
  // Never overwrite — append to thread (handled in updateLog below)
  // Check for deadline change
  var dlInput=document.getElementById('dl-'+mid+'-'+mi);
  var oldDeadline=m.minutes[mi].task.deadline||'';
  var newDeadline=dlInput?dlInput.value:oldDeadline;
  var deadlineChanged=dlInput&&newDeadline!==oldDeadline;
  if(deadlineChanged) m.minutes[mi].task.deadline=newDeadline;
  m.minutes[mi].task.lastUpdatedBy=ST.profile.name;
  // Build log entry
  // Check if completing after deadline
  var isCompletingLate = ss.value==='completed' && m.minutes[mi].task.deadline && new Date(m.minutes[mi].task.deadline) < new Date();
  if(isCompletingLate){
    m.minutes[mi].task.completedLate = true;
    m.minutes[mi].task.completedAt = today();
  }
  var logEntry={
    status:ss.value,
    comment:newComment,
    by:ST.profile.name,
    at:new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),
    completedLate: isCompletingLate ? true : undefined
  };
  if(deadlineChanged) logEntry.deadlineChanged='Deadline updated to '+fmtD(newDeadline);
  // Append to update log for history
  if(!m.minutes[mi].task.updateLog) m.minutes[mi].task.updateLog=[];
  m.minutes[mi].task.updateLog.push(logEntry);

  function doSave(url,name){
    if(url){m.minutes[mi].attachmentUrl=url;m.minutes[mi].attachmentName=name;}
    saveMeeting(m).then(function(){
      toast('✅ Update saved — "'+ss.value+'"!','ok');
      // Clear comment box so user can add fresh update next time
      if(cs) cs.value='';
      if(ss.value==='completed'&&prevStatus!=='completed'){
        var mgrs=getMgrEmails();
        if(mgrs.length){
          var subj='[NTF MeetTrack] ✅ Task Completed — '+(m.meetingName||m.teamName||m.clientName);
          var body='Dear Manager,\n\n'+ST.profile.name+' has completed a task.\n\nMeeting: '+(m.meetingName||'Untitled')+'\nTask: '+m.minutes[mi].text+'\nCompleted by: '+ST.profile.name+'\nDeadline was: '+fmtD(m.minutes[mi].task.deadline);
          openGmail(mgrs.join(','),subj,body);
          toast('Managers notified!','ok');
        }
      }
      return loadMeetings();
    }).then(function(){render();});
  }

  if(file){
    toast('Processing proof...','inf');
    var path='proofs/'+mid+'/'+Date.now()+'_'+file.name;
    uploadFile(file).then(function(url){doSave(url,file.name);}).catch(function(e){toast(e.message,'err');});
  } else {
    doSave(null,null);
  }
};

// ── EXPORT PDF ──────────────────────────────────
window.exportPDF=function(){
  if(typeof window.jspdf==='undefined'){toast('PDF library loading...','inf');return;}
  var doc=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  var m=ST.cur;
  var pw=210; var lm=14; var rm=196; var cw=pw-lm-14;

  // ── HEADER BAND ──
  doc.setFillColor(15,21,53); // #0f1535
  doc.rect(0,0,pw,28,'F');

  // NTF Logo block — orange square with "NTF" text
  doc.setFillColor(232,96,10); // #e8600a
  doc.roundedRect(lm,4,18,18,2,2,'F');
  doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(255,255,255);
  doc.text('NTF',lm+9,11,{align:'center'});
  doc.setFontSize(6);doc.setFont('helvetica','normal');
  doc.text('INDIA',lm+9,15,{align:'center'});

  // App name beside logo
  doc.setFontSize(16);doc.setFont('helvetica','bold');doc.setTextColor(255,255,255);
  doc.text('Meet',36,13);
  doc.setTextColor(232,96,10);
  doc.text('Track',36+doc.getTextWidth('Meet'),13);

  // Tagline
  doc.setFontSize(7);doc.setFont('helvetica','normal');doc.setTextColor(180,180,200);
  doc.text('Minutes of Meeting',36,18);

  // Date on right
  doc.setFontSize(8);doc.setTextColor(200,200,220);
  doc.text('Generated: '+new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}),rm,10,{align:'right'});

  // ── ORANGE DIVIDER LINE ──
  doc.setDrawColor(232,96,10);doc.setLineWidth(0.8);
  doc.line(0,28,pw,28);

  var y=36;

  // ── MEETING INFO BLOCK ──
  doc.setFillColor(245,246,250);
  doc.roundedRect(lm,y,cw,36,3,3,'F');
  doc.setDrawColor(220,220,230);doc.setLineWidth(0.3);
  doc.roundedRect(lm,y,cw,36,3,3,'S');

  // Left accent bar
  doc.setFillColor(232,96,10);
  doc.rect(lm,y,2,36,'F');

  var iy=y+7;
  var col1=lm+6; var col2=lm+cw/2+4;

  doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(15,21,53);
  doc.text('MEETING NAME',col1,iy);
  doc.setFont('helvetica','normal');doc.setTextColor(50,50,80);
  doc.text(m.meetingName||'Untitled',col1,iy+5);

  doc.setFont('helvetica','bold');doc.setTextColor(15,21,53);
  doc.text('TYPE',col2,iy);
  doc.setFont('helvetica','normal');doc.setTextColor(50,50,80);
  doc.text((m.type||'internal').toUpperCase()+' — '+(m.teamName||m.clientName||'-'),col2,iy+5);

  iy+=14;
  doc.setFont('helvetica','bold');doc.setTextColor(15,21,53);
  doc.text('DATE',col1,iy);
  doc.setFont('helvetica','normal');doc.setTextColor(50,50,80);
  doc.text(fmtD(m.date),col1,iy+5);

  doc.setFont('helvetica','bold');doc.setTextColor(15,21,53);
  doc.text('CREATED BY',col2,iy);
  doc.setFont('helvetica','normal');doc.setTextColor(50,50,80);
  doc.text(m.createdBy||'-',col2,iy+5);

  y+=42;

  // ── ATTENDEES ──
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(15,21,53);
  doc.text('ATTENDEES',lm,y);
  doc.setFillColor(232,96,10);doc.rect(lm,y+1,cw,0.5,'F');
  y+=5;
  var attStr=(m.attendees||[]).map(function(a){return a.name;}).join('  ·  ');
  var attLines=doc.splitTextToSize(attStr||'—',cw);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(60,60,80);
  doc.text(attLines,lm,y);
  y+=attLines.length*5+8;

  // ── MINUTES TABLE ──
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(15,21,53);
  doc.text('MINUTES OF MEETING',lm,y);
  doc.setFillColor(232,96,10);doc.rect(lm,y+1,cw,0.5,'F');
  y+=6;

  // Table header
  var cols={num:6,type:18,minute:80,assignee:32,deadline:26,status:20};
  var cx={num:lm, type:lm+cols.num, minute:lm+cols.num+cols.type, assignee:lm+cols.num+cols.type+cols.minute, deadline:lm+cols.num+cols.type+cols.minute+cols.assignee, status:lm+cols.num+cols.type+cols.minute+cols.assignee+cols.deadline};

  function drawTableHeader(yy){
    doc.setFillColor(15,21,53);
    doc.rect(lm,yy,cw,7,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(255,255,255);
    doc.text('#',cx.num+1,yy+4.5);
    doc.text('TYPE',cx.type+1,yy+4.5);
    doc.text('MINUTE / TASK DESCRIPTION',cx.minute+1,yy+4.5);
    doc.text('ASSIGNED TO',cx.assignee+1,yy+4.5);
    doc.text('DEADLINE',cx.deadline+1,yy+4.5);
    doc.text('STATUS',cx.status+1,yy+4.5);
    return yy+7;
  }

  y=drawTableHeader(y);

  var mins=m.minutes||[];
  if(mins.length===0){
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(150,150,150);
    doc.text('No minutes recorded.',lm+2,y+6);
    y+=12;
  } else {
    mins.forEach(function(mn,i){
      var isTask=mn.type==='assign';
      var t=mn.task||null;
      var descLines=doc.splitTextToSize(mn.text||'',cols.minute-4);
      var rowH=Math.max(8,descLines.length*4.5+4);

      // Page break check
      if(y+rowH>280){
        doc.addPage();
        // Repeat mini header on new page
        doc.setFillColor(15,21,53);doc.rect(0,0,pw,10,'F');
        doc.setFontSize(7);doc.setFont('helvetica','bold');doc.setTextColor(255,255,255);
        doc.text('NTF MeetTrack — '+(m.meetingName||'Meeting')+' (continued)',lm,6.5);
        y=16;
        y=drawTableHeader(y);
      }

      // Row bg alternating
      if(i%2===0){doc.setFillColor(249,250,252);}else{doc.setFillColor(255,255,255);}
      doc.rect(lm,y,cw,rowH,'F');

      // Row border
      doc.setDrawColor(230,230,235);doc.setLineWidth(0.2);
      doc.rect(lm,y,cw,rowH,'S');

      // Type badge color
      if(isTask){doc.setFillColor(255,237,213);doc.setTextColor(194,65,12);}

      // Minute text
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(30,30,50);
      doc.text(descLines,cx.minute+1,y+4.5);

      // Task columns
      if(isTask&&t){
        doc.setFontSize(8);doc.setTextColor(30,30,50);
        doc.text(t.assignee||'—',cx.assignee+1,y+rowH/2+1.5);
        doc.text(fmtD(t.deadline),cx.deadline+1,y+rowH/2+1.5);

        // Status badge
        var sc,sb;
        if(t.status==='completed'){sc=[22,101,52];sb=[240,253,244];}
        else if(t.status==='ongoing'){sc=[30,64,175];sb=[239,246,255];}
        else{sc=[133,77,14];sb=[254,252,232];}
        doc.setFillColor(sb[0],sb[1],sb[2]);
        doc.roundedRect(cx.status+1,y+rowH/2-2,17,5,1,1,'F');
        doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor(sc[0],sc[1],sc[2]);
        doc.text((t.status||'pending').toUpperCase(),cx.status+9.5,y+rowH/2+1.5,{align:'center'});

        // Comment if any
        if(t.lastComment){
          doc.setFont('helvetica','italic');doc.setFontSize(6.5);doc.setTextColor(130,130,150);
          var cLines=doc.splitTextToSize('💬 '+t.lastComment,cols.minute-4);

      } else {
        doc.setFontSize(8);doc.setTextColor(180,180,190);
        doc.text('—',cx.assignee+1,y+rowH/2+1.5);
        doc.text('—',cx.deadline+1,y+rowH/2+1.5);
        doc.text('—',cx.status+1,y+rowH/2+1.5);
      }

      y+=rowH;
    });
  }

  y+=8;

  // ── SUMMARY BOX ──
  var tasks=mins.filter(function(mn){return mn.type==='assign'&&mn.task;});
  var done=tasks.filter(function(mn){return mn.task.status==='completed';}).length;
  var pend=tasks.filter(function(mn){return mn.task.status==='pending';}).length;
  var ong=tasks.filter(function(mn){return mn.task.status==='ongoing';}).length;

  if(y+22>285){doc.addPage();y=20;}

  doc.setDrawColor(220,220,230);doc.setLineWidth(0.3);doc.roundedRect(lm,y,cw,20,2,2,'S');
  doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(15,21,53);

function checkDeadlines(){
  var tomorrow=new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  var tStr=tomorrow.toISOString().split('T')[0];
  var today2=new Date().toISOString().split('T')[0];
  var myEmail=ST.profile&&ST.profile.email;
  var alerts=[];
  ST.meetings.forEach(function(m){
    (m.minutes||[]).forEach(function(mn){
      if(mn.type==='assign'&&mn.task&&mn.task.status!=='completed'){
        // ONLY show tasks assigned to the logged-in user — regardless of role
        if(mn.task.assigneeEmail!==myEmail) return;
        var d=mn.task.deadline;
        if(!d) return;
        var isToday=d===today2;
        var isTmrw=d===tStr;
        var isPast=d<today2;
        if(isToday||isTmrw||isPast){
          alerts.push({
            meetingName:m.meetingName||'Untitled',
            text:mn.text,
            assignee:mn.task.assignee,
            assigneeEmail:mn.task.assigneeEmail,
            deadline:d,
            status:mn.task.status,
            urgency:isPast?'overdue':isToday?'today':'tomorrow'
          });
        }
      }
    });
  });
  if(!alerts.length) return;
  showDeadlinePopup(alerts);
}

window.doSearch=function(q){
  q=(q||'').trim().toLowerCase();
  var overlay=document.getElementById('search-overlay');
  if(!overlay) return;
  if(!q){overlay.style.display='none';return;}
  overlay.style.display='block';
  var results=[];
  ST.meetings.forEach(function(m){
    var inName=(m.meetingName||'').toLowerCase().indexOf(q)!==-1;
    var inDate=(m.date||'').indexOf(q)!==-1;
    var inCreator=(m.createdBy||'').toLowerCase().indexOf(q)!==-1;
    var inRef=((m.teamName||m.clientName||'').toLowerCase()).indexOf(q)!==-1;
    var inAtt=(m.attendees||[]).some(function(a){return a.name.toLowerCase().indexOf(q)!==-1||a.email.toLowerCase().indexOf(q)!==-1;});
    var inMin=(m.minutes||[]).some(function(mn){return (mn.text||'').toLowerCase().indexOf(q)!==-1;});
    if(inName||inDate||inCreator||inRef||inAtt||inMin){
      var reason=inMin?'Found in minutes':inAtt?'Found in attendees':inRef?'Team / Client match':'';
      results.push({m:m,reason:reason});
    }
  });
  var box=document.getElementById('search-box');
  if(!box) return;
  if(results.length===0){
    box.innerHTML='<div style="text-align:center;padding:2rem;color:#9ca3af;font-size:13px">No meetings found for "'+q+'"</div>';
    return;
  }
  box.innerHTML=results.slice(0,12).map(function(r){
    var m=r.m; var mStatus=m.status||'scheduled';
    var stBg={completed:'#f0fdf4',cancelled:'#fef2f2',ongoing:'#eff6ff',scheduled:'#f0f9ff'};
    var stCl={completed:'#166534',cancelled:'#991b1b',ongoing:'#1e40af',scheduled:'#075985'};
    return '<div class="search-res-item" onclick="closeSearch();openMeeting(\''+m.id+'\')">'+
    '<div style="font-size:22px">📋</div>'+
    '<div style="flex:1">'+
    '<div style="font-size:13px;font-weight:700;color:#0f1535">'+(m.meetingName||'Untitled')+'</div>'+
    '<div style="font-size:11px;color:#888;margin-top:2px">'+m.date+' &nbsp;·&nbsp; '+(m.type==='internal'?m.teamName:m.clientName)+' &nbsp;·&nbsp; By '+m.createdBy+'</div>'+
    (r.reason?'<div style="font-size:10px;color:#e8600a;margin-top:2px">'+r.reason+'</div>':'')+
    '</div>'+
    '<span style="font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;flex-shrink:0;background:'+stBg[mStatus]+';color:'+stCl[mStatus]+'">'+mStatus+'</span>'+
    '</div>';
  }).join('');
};

function buildEmpMap(period){
  period=period||ST.perfPer||'overall';
  var now=new Date();
  var filtered=ST.meetings.filter(function(m){
    if(period==='overall')return true;
    var d=new Date(m.date);
    if(period==='daily')return m.date===today();
    if(period==='weekly'){var w=new Date(now);w.setDate(w.getDate()-7);return d>=w;}
    if(period==='monthly'){var mo=new Date(now.getFullYear(),now.getMonth(),1);return d>=mo;}
    return true;
  });
  var empMap={};
  ST.allUsers.filter(function(u){return u.role==='employee';}).forEach(function(u){
    empMap[u.email]={name:u.name,email:u.email,total:0,completed:0,pending:0,ongoing:0,overdue:0,lateCompleted:0};
  });
  ST.meetings.forEach(function(m){
    (m.minutes||[]).forEach(function(mn){
      if(mn.type!=='assign'||!mn.task) return;
      var t=mn.task; var email=t.assigneeEmail||'';
      if(!empMap[email]) empMap[email]={name:t.assignee||email,email:email,total:0,completed:0,pending:0,ongoing:0,overdue:0};
      var e=empMap[email];
      e.total++;
      if(t.status==='completed'){e.completed++; if(t.completedLate) e.lateCompleted++;}
      else if(t.status==='ongoing') e.ongoing++;
      else e.pending++;
      if(isOv(t.deadline,t.status)) e.overdue++;
    });
  });
  return empMap;
}

window.exportPerfCSV=function(){
  var emps=ST.allUsers.filter(function(u){return u.role==='employee';});
  var empMap={};
  emps.forEach(function(u){empMap[u.email]={name:u.name,email:u.email,total:0,completed:0,pending:0,ongoing:0,overdue:0,lateCompleted:0};});
  ST.meetings.forEach(function(m){
    (m.minutes||[]).forEach(function(mn){
      if(mn.type!=='assign'||!mn.task) return;
      var t=mn.task;var e=empMap[t.assigneeEmail];
      if(!e) return;
      e.total++;
      if(t.status==='completed'){e.completed++; if(t.completedLate) e.lateCompleted++;}
      else if(t.status==='ongoing') e.ongoing++;
      else e.pending++;
      if(isOv(t.deadline,t.status)) e.overdue++;
    });
  });
  var rows=[['Name','Email','Total Tasks','Completed','Ongoing','Pending','Overdue','Completion Rate %']];
  Object.values(empMap).forEach(function(e){
    rows.push([e.name,e.email,e.total,e.completed,e.ongoing,e.pending,e.overdue,e.total>0?Math.round(e.completed/e.total*100):0]);
  });
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  try{
    var blob=new Blob([csv],{type:'text/csv'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='NTF_Performance_'+today()+'.csv';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    toast('CSV downloaded!','ok');
  } catch(e){
    // Fallback: open as data URI
    var uri='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
    var a=document.createElement('a');a.href=uri;a.download='NTF_Performance_'+today()+'.csv';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    toast('CSV downloaded!','ok');
  }
};

  var now=new Date(); var mo=new Date(now.getFullYear(),now.getMonth(),1);
  var monthMeetings=ST.meetings.filter(function(m){return new Date(m.date)>=mo;});
  var monthLabel=now.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  var empData={};
  ST.allUsers.filter(function(u){return u.role==='employee';}).forEach(function(u){
    empData[u.email]={name:u.name,email:u.email,total:0,completed:0,pending:0,ongoing:0,overdue:0,meetings:0};
  });
  monthMeetings.forEach(function(m){
    (m.attendees||[]).forEach(function(a){if(empData[a.email])empData[a.email].meetings++;});
    (m.minutes||[]).forEach(function(mn){
      if(mn.type!=='assign'||!mn.task)return;
      var t=mn.task; var e=empData[t.assigneeEmail]; if(!e)return;
      e.total++;
      if(t.status==='completed')e.completed++;
      else if(t.status==='ongoing')e.ongoing++; else e.pending++;
      if(isOv(t.deadline,t.status))e.overdue++;
    });
  });
  var emps=Object.values(empData).filter(function(e){return e.total>0||e.meetings>0;}).sort(function(a,b){return (b.completed/Math.max(b.total,1))-(a.completed/Math.max(a.total,1));});
  // Cover page
  doc.setFillColor(15,21,53); doc.rect(0,0,pw,210,'F');
  doc.setFillColor(232,96,10); doc.rect(0,0,3,210,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(30); doc.setTextColor(255,255,255);
  doc.text('Monthly Performance Report',lm,80);
  doc.setFontSize(18); doc.setTextColor(232,96,10);
  doc.text(monthLabel,lm,95);
  doc.setFontSize(11); doc.setTextColor(168,196,224);
  doc.text('NTF India · MeetTrack · '+new Date().toLocaleDateString('en-IN'),lm,160);
  doc.text('Total: '+emps.length+' employees · '+monthMeetings.length+' meetings',lm,168);
  // Summary table
  doc.addPage();
  doc.setFillColor(15,21,53); doc.rect(0,0,pw,14,'F');
  doc.setFillColor(232,96,10); doc.rect(0,0,3,14,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(255,255,255);
  doc.text('Employee Summary — '+monthLabel,lm,9);
  var headers=['#','Name','Email','Meetings','Tasks','Done','Pending','Overdue','Rate'];
  var cols=[6,36,52,18,14,12,14,14,14]; var tx=[lm];
  cols.forEach(function(w,i){if(i>0)tx.push(tx[i-1]+cols[i-1]);});
  var ty=18;
  doc.setFillColor(30,46,80); doc.rect(lm,ty,pw-lm*2,7,'F');
  doc.setFontSize(7); doc.setTextColor(200,210,230);
  headers.forEach(function(h,i){doc.text(h,tx[i]+1,ty+5);});
  ty+=7;
  emps.forEach(function(e,i){
    if(ty>200){doc.addPage();ty=20;}
    var rate=e.total>0?Math.round(e.completed/e.total*100):0;
    var rc=rate>=80?[22,163,74]:rate>=50?[217,119,6]:[220,38,38];
    doc.setFillColor(i%2===0?248:255,i%2===0?249:255,i%2===0?252:255);
    doc.rect(lm,ty,pw-lm*2,7,'F');
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(20,20,40);
    [String(i+1),e.name.slice(0,22),e.email.slice(0,28),String(e.meetings),String(e.total),String(e.completed),String(e.pending),String(e.overdue)].forEach(function(v,j){doc.text(v,tx[j]+1,ty+5);});
    doc.setFillColor.apply(doc,rc); doc.roundedRect(tx[8]+1,ty+1.5,11,4,1,1,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor(255,255,255);
    doc.text(rate+'%',tx[8]+6.5,ty+4.5,{align:'center'});
    ty+=7;
  });
  doc.save('NTF_Performance_'+monthLabel.replace(/ /g,'_')+'.pdf');
  toast('Monthly PDF downloaded!','ok');
};
window.exportPerfPDF=function(){
  if(typeof window.jspdf==='undefined'){
    toast('PDF library not loaded. Use Live Server or Netlify.','err');
    // Fallback: print the page
    window.print();
    return;
  }
  var doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  var pw=297;var lm=14;

  // Header
  doc.setFillColor(15,21,53);doc.rect(0,0,pw,22,'F');
  doc.setFillColor(232,96,10);doc.roundedRect(lm,3,14,14,1.5,1.5,'F');
  doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(255,255,255);
  doc.text('NTF',lm+7,9,{align:'center'});doc.setFontSize(5.5);doc.setFont('helvetica','normal');doc.text('INDIA',lm+7,13,{align:'center'});
  doc.setFontSize(13);doc.setFont('helvetica','bold');doc.setTextColor(255,255,255);doc.text('MeetTrack',32,10);
  doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(180,180,200);doc.text('Employee Performance Report',32,15);
  doc.setFontSize(7);doc.setTextColor(200,200,220);doc.text('Generated: '+new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}),pw-14,10,{align:'right'});

  var y=30;
  var cols=[20,55,18,18,16,16,16,28];
  var headers=['#','Employee','Total','Completed','Ongoing','Pending','Overdue','Rate'];
  var cx=[lm];cols.forEach(function(w,i){if(i>0)cx.push(cx[i-1]+cols[i-1]);});

  // Table header
  doc.setFillColor(15,21,53);doc.rect(lm,y,pw-lm*2,8,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(255,255,255);
  headers.forEach(function(h,i){doc.text(h,cx[i]+1,y+5.5);});
  y+=8;

  var empMap2={};
  ST.allUsers.filter(function(u){return u.role==='employee';}).forEach(function(u){empMap2[u.email]={name:u.name,email:u.email,total:0,completed:0,pending:0,ongoing:0,overdue:0};});
  ST.meetings.forEach(function(m){
    (m.minutes||[]).forEach(function(mn){
      if(mn.type!=='assign'||!mn.task) return;
      var t=mn.task;var e=empMap2[t.assigneeEmail];
      if(!e) return;
      e.total++;
      if(t.status==='completed'){e.completed++; if(t.completedLate) e.lateCompleted++;}
      else if(t.status==='ongoing') e.ongoing++;
      else e.pending++;
      if(isOv(t.deadline,t.status)) e.overdue++;
    });
  });
  Object.values(empMap2).sort(function(a,b){return b.total-a.total;}).forEach(function(e,i){
    if(y>185){doc.addPage();y=20;}
    if(i%2===0) doc.setFillColor(249,250,252); else doc.setFillColor(255,255,255);
    doc.rect(lm,y,pw-lm*2,7,'F');
    doc.setDrawColor(230,230,235);doc.setLineWidth(0.2);doc.rect(lm,y,pw-lm*2,7,'S');
    var rate=e.total>0?Math.round(e.completed/e.total*100):0;
    var vals=[String(i+1),e.name,String(e.total),String(e.completed),String(e.ongoing),String(e.pending),String(e.overdue),rate+'%'];
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(30,30,50);
    vals.forEach(function(v,j){doc.text(v,cx[j]+1,y+5);});
    y+=7;
  });

  // Footer
  var tp=doc.internal.getNumberOfPages();
  for(var pg=1;pg<=tp;pg++){
    doc.setPage(pg);
    doc.setFillColor(15,21,53);doc.rect(0,doc.internal.pageSize.height-8,pw,8,'F');
    doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(180,180,200);
    doc.text('NTF India — MeetTrack | Confidential',lm,doc.internal.pageSize.height-3);
    doc.text('Page '+pg+' of '+tp,pw-lm,doc.internal.pageSize.height-3,{align:'right'});
  }
  doc.save('NTF_Employee_Performance_'+today()+'.pdf');
  toast('Performance PDF downloaded!','ok');
};

// ── MODAL ────────────────────────────────────────
function showModal(title,fields,saveLbl,onSave){
  document.querySelectorAll('.modal-bg').forEach(function(m){m.remove();});
  var d=document.createElement('div');d.className='modal-bg';
  d.innerHTML='<div class="modal-card"><div class="modal-title">'+title+'</div>'+
  fields.map(function(f){
    return '<div class="modal-field"><label>'+f.l+'</label><input class="inp modal-inp" data-k="'+f.k+'" placeholder="'+(f.ph||'')+'" value="'+(f.v||'')+'" type="'+(f.t||'text')+'"></div>';
  }).join('')+
  '<div class="modal-actions"><button class="btn btn-gy btn-sm" id="modal-cancel">Cancel</button><button class="btn btn-or btn-sm" id="modal-save">'+saveLbl+'</button></div></div>';
  document.body.appendChild(d);

  d.querySelector('#modal-save').onclick=function(){
    var v={};d.querySelectorAll('.modal-inp').forEach(function(i){v[i.dataset.k]=i.value.trim();});
    d.remove();onSave(v);
  };
  d.onclick=function(e){if(e.target===d)d.remove();};
  setTimeout(function(){var f=d.querySelector('.modal-inp');if(f)f.focus();},100);
}
</script>
