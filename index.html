<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTF MeetTrack</title>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-firestore-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-storage-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;font-size:14px;color:#1a1a2e;min-height:100vh}
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;border:none;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-or{background:#e8600a;color:#fff}
.btn-nv{background:#0f1535;color:#fff}
.btn-gr{background:#16a34a;color:#fff}
.btn-rd{background:#dc2626;color:#fff}
.btn-gy{background:#6b7280;color:#fff}
.btn-sm{padding:6px 12px !important;font-size:12px !important}
.btn-xs{padding:4px 9px !important;font-size:11px !important}
.btn-full{width:100%;justify-content:center;padding:13px 16px;font-size:14px}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0f2e,#0f1535);padding:20px}
.auth-box{background:#fff;border-radius:16px;padding:36px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.auth-brand{text-align:center;margin-bottom:24px}
.auth-ntf{font-size:11px;font-weight:700;letter-spacing:3px;color:#e8600a;text-transform:uppercase;margin-bottom:6px}
.auth-logo{font-size:30px;font-weight:700;color:#0f1535}
.auth-logo span{color:#e8600a}
.auth-sub{font-size:13px;color:#888;margin-top:4px}
.role-tabs{display:flex;gap:4px;background:#f5f5f5;padding:4px;border-radius:10px;margin-bottom:20px}
.role-tab{flex:1;padding:9px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:#666;font-family:inherit;transition:all .15s}
.role-tab.active{background:#0f1535;color:#fff;font-weight:700}
.hint{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 13px;font-size:12px;color:#1e40af;margin-bottom:16px;line-height:1.7}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:11px;font-weight:700;color:#374151;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.auth-field input{width:100%;padding:11px 13px;border:2px solid #e5e7eb;border-radius:9px;background:#f9fafb;color:#111;font-size:14px;font-family:inherit}
.auth-field input:focus{outline:none;border-color:#0f1535;background:#fff}
.auth-err{background:#fff5f5;border:1px solid #fca5a5;color:#991b1b;font-size:12px;padding:10px 13px;border-radius:8px;margin-bottom:14px}
.auth-link{text-align:center;font-size:13px;color:#777;margin-top:14px}
.auth-link span{color:#e8600a;cursor:pointer;font-weight:700;text-decoration:underline}
.app-layout{display:flex;min-height:100vh}
.sidebar{width:210px;background:#0f1535;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:50}
.sb-brand{padding:18px 14px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-ntf{font-size:9px;font-weight:700;letter-spacing:2.5px;color:#e8600a;text-transform:uppercase;margin-bottom:4px}
.sb-name{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.3px}
.sb-name span{color:#e8600a}
.sb-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px}
.sb-section{font-size:9px;font-weight:700;color:rgba(255,255,255,.3);padding:12px 14px 3px;text-transform:uppercase;letter-spacing:1.5px}
.nav-item{padding:10px 14px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.55);border-left:3px solid transparent;display:flex;align-items:center;gap:9px;font-weight:500;transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(232,96,10,.15);color:#fff;border-left-color:#e8600a;font-weight:600}
.sb-user{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:9px}
.sb-av{width:34px;height:34px;border-radius:9px;background:#e8600a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.sb-uname{font-size:12px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-urole{font-size:10px;color:rgba(255,255,255,.4);text-transform:capitalize}
.sb-logout{width:28px;height:28px;background:rgba(255,255,255,.1);border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.4);font-size:16px;flex-shrink:0;border:none}
.sb-logout:hover{background:rgba(255,255,255,.2);color:#fff}
.main-content{flex:1;margin-left:210px;padding:28px;background:#f0f2f5;min-height:100vh}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-size:24px;font-weight:700;color:#0f1535;letter-spacing:-.3px}
.page-sub{font-size:13px;color:#888;margin-top:4px}
.back-link{display:inline-flex;align-items:center;gap:6px;color:#e8600a;cursor:pointer;font-weight:600;font-size:13px;margin-bottom:16px;padding:7px 14px;background:#fff7ed;border-radius:8px;border:1px solid #fed7aa}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:#0f1535;text-transform:uppercase;letter-spacing:.6px}
.card-label::before{content:'';width:3px;height:14px;background:#e8600a;border-radius:2px;flex-shrink:0}
.inp{width:100%;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:8px;background:#f9fafb;color:#111;font-size:13px;font-family:inherit;transition:border-color .2s}
.inp:focus{outline:none;border-color:#0f1535;background:#fff}
select.inp{cursor:pointer}
textarea.inp{resize:none;line-height:1.5}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.b-pending{background:#fefce8;color:#854d0e;border:1px solid #fde68a}
.b-ongoing{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.b-completed{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.b-internal{background:#f5f3ff;color:#5b21b6;border:1px solid #ddd6fe}
.b-external{background:#fdf4ff;color:#7e22ce;border:1px solid #e9d5ff}
.b-emp{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;font-size:10px;padding:1px 7px}
.b-ov{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.b-mine{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.stats-row{display:grid;gap:12px;margin-bottom:20px}
.stats-4{grid-template-columns:repeat(4,1fr)}
.stat-box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-num{font-size:26px;font-weight:700;color:#0f1535;letter-spacing:-.5px}
.stat-text{font-size:12px;color:#888;margin-top:3px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;max-width:600px}
.home-card{background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:20px;cursor:pointer;transition:all .2s}
.home-card:hover{border-color:#e8600a;transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,96,10,.1)}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.team-card{background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:16px;cursor:pointer;transition:all .15s;position:relative}
.team-card:hover{border-color:#e8600a}
.team-card-actions{position:absolute;top:8px;right:8px;display:none;gap:4px}
.team-card:hover .team-card-actions{display:flex}
.pills-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:30px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:20px;font-size:12px;font-weight:500}
.pill-x{cursor:pointer;color:#9ca3af;font-weight:700;font-size:13px;line-height:1;margin-left:2px}
.pill-x:hover{color:#dc2626}
.minute-row{display:flex;gap:10px;padding:10px 13px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:9px;margin-bottom:8px;align-items:flex-start}
.minute-num{font-size:11px;font-weight:700;color:#e8600a;min-width:20px;flex-shrink:0;margin-top:1px}
.minute-text{flex:1;font-size:13px;line-height:1.5;color:#111}
.minute-del{background:#dc2626;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px;padding:4px 9px;font-weight:700;flex-shrink:0}
.minute-del:hover{background:#b91c1c}
.task-box{background:#fff;border:1px solid #e5e7eb;border-left:4px solid #cbd5e1;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.task-box.mine{border-left-color:#16a34a;background:#f9fffe}
.task-box.overdue{border-left-color:#dc2626;background:#fff9f9}
.task-tags{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.task-desc{font-size:13px;color:#374151;line-height:1.5;margin-bottom:13px;padding:10px 13px;background:#f8fafc;border-radius:8px;border-left:3px solid #e8600a;font-weight:500}
.task-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.field-label{font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.task-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid #f3f4f6;align-items:center}
.task-note{font-size:11px;color:#555;padding:7px 11px;background:#f8fafc;border-radius:7px;margin-top:6px;border-left:2px solid #e8600a;line-height:1.4}
.client-row{background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .15s;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.client-row:hover{border-color:#e8600a}
.client-av{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#e8600a,#f09040);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.section-heading{font-size:12px;font-weight:700;color:#0f1535;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 10px;padding-bottom:7px;border-bottom:2px solid #e5e7eb}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-chip{padding:6px 16px;border:2px solid #e5e7eb;border-radius:20px;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#555;font-family:inherit;transition:all .15s}
.filter-chip.active{background:#0f1535;color:#fff;border-color:#0f1535}
.table-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
table{width:100%;border-collapse:collapse}
th{padding:11px 13px;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;background:#f9fafb;border-bottom:1px solid #f3f4f6;text-align:left;letter-spacing:.5px}
td{padding:11px 13px;border-bottom:1px solid #f9fafb;font-size:12px;color:#111;vertical-align:middle}
tr:last-child td{border:none}
tr:hover td{background:#fafafa}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,40,.65);display:flex;align-items:center;justify-content:center;z-index:9999}
.modal-card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.modal-title{font-size:17px;font-weight:700;color:#0f1535;margin-bottom:18px}
.modal-field{margin-bottom:13px}
.modal-field label{display:block;font-size:11px;font-weight:700;color:#374151;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.modal-actions{display:flex;gap:9px;margin-top:18px;justify-content:flex-end}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:11px;font-size:13px;font-weight:600;z-index:99999;animation:toastIn .2s ease;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px}
.toast-ok{background:#166534}.toast-err{background:#991b1b}.toast-inf{background:#1e40af}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0f1535}
.loader{width:40px;height:40px;border:4px solid rgba(232,96,10,.2);border-top-color:#e8600a;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media print{.sidebar,.btn,.back-link,.task-actions,.team-card-actions,.filter-bar,.page-head .btn{display:none!important}.main-content{margin-left:0!important}}
</style>
</head>
<body>
<div id="root">
  <div class="loading-screen">
    <div class="loader"></div>
    <div style="color:rgba(255,255,255,.5);font-size:14px">Loading NTF MeetTrack...</div>
  </div>
</div>

<script>
// ── FIREBASE CONFIG ──────────────────────────
var firebaseConfig = {
  apiKey: "AIzaSyAlr2Rn4cGBKfMM9mcgKJ3H9rj9tPW5kD0",
  authDomain: "meettrack-1bd7e.firebaseapp.com",
  projectId: "meettrack-1bd7e",
  storageBucket: "meettrack-1bd7e.appspot.com",
  messagingSenderId: "199366587854",
  appId: "1:199366587854:web:3a94a783f60a6e28fbe79f"
};
firebase.initializeApp(firebaseConfig);
var auth    = firebase.auth();
var db      = firebase.firestore();
var storage = firebase.storage();

// ── STATE ──────────────────────────────────────
var ST = {
  page:'loading', user:null, profile:null,
  aMode:'login', aRole:'employee', aErr:'',
  allUsers:[], teams:[], clients:[], meetings:[],
  cur:null, dFil:'all', dPer:'monthly'
};

// ── HELPERS ────────────────────────────────────
function ini(n){ return (n||'?').split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2); }
function today(){ return new Date().toISOString().split('T')[0]; }
function fmtD(d){ if(!d) return 'Not set'; try{ return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return d; } }
function isOv(d,s){ return d && s!=='completed' && new Date(d) < new Date(); }
function canM(){ return ST.profile && (ST.profile.role==='director'||ST.profile.role==='boss'); }

function getPeople(m){
  var mp = {};
  ST.allUsers.forEach(function(u){ mp[u.email] = u.name; });
  (m&&m.attendees||[]).forEach(function(a){ if(!mp[a.email]) mp[a.email]=a.name; });
  return Object.keys(mp).map(function(e){ return {e:e, n:mp[e]}; });
}

function getMgrEmails(){
  return ST.allUsers.filter(function(u){ return u.role==='boss'||u.role==='director'; }).map(function(u){ return u.email; }).filter(Boolean);
}

function toast(msg, type){
  type = type||'inf';
  document.querySelectorAll('.toast').forEach(function(t){ t.remove(); });
  var el = document.createElement('div');
  el.className = 'toast toast-'+type;
  el.innerHTML = (type==='ok'?'✓':type==='err'?'✕':'ℹ')+' '+msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3000);
}

function openGmail(to, subject, body){
  var url = 'https://mail.google.com/mail/?view=cm&to='+encodeURIComponent(to)+'&su='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  window.open(url, '_blank');
}


// ── FILE UPLOAD ───────────────────────────
function uploadFile(file, path, onProgress){
  return new Promise(function(resolve, reject){
    var safeName = Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    var ref = storage.ref().child(path+'/'+safeName);
    var task = ref.put(file);
    task.on('state_changed',
      function(snap){
        var pct = Math.round(snap.bytesTransferred/snap.totalBytes*100);
        if(onProgress) onProgress(pct);
      },
      function(err){ reject(err); },
      function(){
        task.snapshot.ref.getDownloadURL().then(function(url){
          resolve({name:file.name, url:url, size:file.size, uploadedBy:ST.profile?ST.profile.name:'Unknown'});
        });
      }
    );
  });
}
// ── FIREBASE LOAD ─────────────────────────────
function loadAll(){
  return Promise.all([loadUsers(), loadTeams(), loadClients(), loadMeetings()]);
}

function loadUsers(){
  return db.collection('users').get().then(function(snap){
    ST.allUsers = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  });
}

function loadTeams(){
  return db.collection('teams').get().then(function(snap){
    ST.teams = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    if(!ST.teams.length) return seedTeams();
  });
}

function seedTeams(){
  var defs = [{name:'HR',icon:'👥'},{name:'Tech',icon:'💻'},{name:'Operations',icon:'⚙️'},{name:'Marketing',icon:'📣'},{name:'Finance',icon:'💰'},{name:'Legal',icon:'⚖️'}];
  var promises = defs.map(function(t){
    return db.collection('teams').add(t).then(function(r){
      ST.teams.push(Object.assign({id:r.id}, t));
    });
  });
  return Promise.all(promises);
}

function loadClients(){
  return db.collection('clients').get().then(function(snap){
    ST.clients = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  });
}

function loadMeetings(){
  return db.collection('meetings').orderBy('createdAt','desc').get().then(function(snap){
    ST.meetings = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  }).catch(function(){
    return db.collection('meetings').get().then(function(snap){
      ST.meetings = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    });
  });
}

function saveMeeting(m){
  var data = JSON.parse(JSON.stringify(m));
  var id = data.id;
  delete data.id;
  if(id){
    return db.collection('meetings').doc(id).update(data).then(function(){
      m.id = id;
      var idx = ST.meetings.findIndex(function(x){ return x.id === id; });
      if(idx !== -1){ ST.meetings[idx] = JSON.parse(JSON.stringify(m)); }
    }).catch(function(){
      return db.collection('meetings').doc(id).set(data).then(function(){ m.id = id; });
    });
  } else {
    data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    return db.collection('meetings').add(data).then(function(r){
      m.id = r.id;
      ST.meetings.unshift(JSON.parse(JSON.stringify(m)));
    });
  }
}

// ── AUTH ──────────────────────────────────────
var authTimeout = setTimeout(function(){
  if(ST.page==='loading'){ ST.page='auth'; render(); }
}, 6000);

auth.onAuthStateChanged(function(user){
  clearTimeout(authTimeout);
  if(user){
    ST.user = user;
    db.collection('users').doc(user.uid).get().then(function(snap){
      if(!snap.exists){ auth.signOut(); ST.page='auth'; render(); return; }
      ST.profile = Object.assign({id:snap.id}, snap.data());
      return loadAll();
    }).then(function(){
      ST.page = 'home';
      render();
    }).catch(function(e){
      console.error(e);
      ST.page = 'auth';
      ST.aErr = 'Connection error: '+e.message;
      render();
    });
  } else {
    ST.user = null;
    ST.profile = null;
    ST.page = 'auth';
    render();
  }
});

// ── RENDER ────────────────────────────────────
function render(){
  var root = document.getElementById('root');
  if(ST.page==='auth'){ root.innerHTML=authHTML(); return; }
  root.innerHTML = sidebarHTML() + '<div class="main-content" id="main"></div>';
  document.getElementById('main').innerHTML = pageHTML();
}

// ── AUTH HTML ─────────────────────────────────
function authHTML(){
  var isL = ST.aMode==='login';
  return '<div class="auth-page"><div class="auth-box">'+
  '<div class="auth-brand"><div class="auth-ntf">NTF India</div><div class="auth-logo">Meet<span>Track</span></div><div class="auth-sub">'+(isL?'Sign in to your workspace':'Create your employee account')+'</div></div>'+
  (isL?'<div class="role-tabs">'+['employee','director','boss'].map(function(r){
    return '<div class="role-tab'+(ST.aRole===r?' active':'')+'" onclick="setRole(\''+r+'\')">'+r[0].toUpperCase()+r.slice(1)+'</div>';

  '<button class="btn btn-or btn-full" onclick="doAuth()">'+( isL?'Sign In →':'Create Account →')+'</button>'+
  '<div class="auth-link">'+(isL?'No account? <span onclick="switchAuth()">Create employee account</span>':'Have account? <span onclick="switchAuth()">Sign in</span>')+'</div>'+

window.setRole = function(r){ ST.aRole=r; ST.aErr=''; render(); };
window.switchAuth = function(){ ST.aMode=ST.aMode==='login'?'register':'login'; ST.aErr=''; render(); };
window.doAuth = function(){
  var email = (document.getElementById('a-email')||{}).value||'';
  var pass  = (document.getElementById('a-pass')||{}).value||'';
  email = email.trim();
  var btn = document.querySelector('.btn-full');
  if(btn){ btn.disabled=true; btn.textContent='Please wait...'; }

  if(ST.aMode==='login'){
    auth.signInWithEmailAndPassword(email, pass).then(function(cred){
      return db.collection('users').doc(cred.user.uid).get().then(function(snap){
        if(!snap.exists || snap.data().role!==ST.aRole){
          return auth.signOut().then(function(){
            ST.aErr='No '+ST.aRole+' account found. Check your role or credentials.';
            render();
          });
        }
      });
    }).catch(function(e){
      ST.aErr = e.code==='auth/user-not-found'?'Account not found':
                e.code==='auth/wrong-password'?'Incorrect password':
                e.code==='auth/invalid-credential'?'Invalid email or password':
                e.code==='auth/too-many-requests'?'Too many attempts. Try later.':
                e.message;
      render();
    });
  } else {
    var nameEl = document.getElementById('a-name');
    var name = nameEl ? nameEl.value.trim() : '';
    if(!name){ ST.aErr='Enter your full name'; render(); return; }
    auth.createUserWithEmailAndPassword(email, pass).then(function(cred){
      return db.collection('users').doc(cred.user.uid).set({
        name:name, email:email, role:'employee',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }).catch(function(e){
      ST.aErr = e.code==='auth/email-already-in-use'?'Email already registered':
                e.code==='auth/weak-password'?'Password must be 6+ characters':
                e.message;
      render();
    });
  }
};

// ── ATTACH FILE TO MINUTE ─────────────────
window.attachToMin = function(input, minIdx){
  if(!input.files||!input.files.length) return;
  var files = Array.from(input.files);
  toast('Uploading '+files.length+' file(s)...','inf');
  var btn = input.nextElementSibling||input.parentElement;
  Promise.all(files.map(function(f){
    return uploadFile(f, 'meetings/'+ST.cur.id+'/min-'+minIdx);
  })).then(function(infos){
    var mn = ST.cur.minutes[minIdx];
    if(typeof mn === 'string'){
      ST.cur.minutes[minIdx] = {text:mn, attachments:[], addedBy:'', addedAt:today()};
      mn = ST.cur.minutes[minIdx];
    }
    if(!mn.attachments) mn.attachments = [];
    infos.forEach(function(info){
      info.uploadedBy = ST.profile ? ST.profile.name : 'Unknown';
      info.uploadedAt = new Date().toLocaleDateString('en-IN');
      mn.attachments.push(info);
    });
    return saveMeeting(ST.cur);
  }).then(function(){
    toast('File(s) attached successfully!','ok');
    render();
  }).catch(function(err){
    toast('Upload failed: '+err.message,'err');
  });
};

// ── ATTACH FILE TO TASK (My Tasks proof) ──
window.attachToTask = function(input, mid, ti){
  if(!input.files||!input.files.length) return;
  var files = Array.from(input.files);
  toast('Uploading proof...','inf');
  var m = ST.meetings.find(function(x){return x.id===mid;}); if(!m) return;
  Promise.all(files.map(function(f){
    return uploadFile(f, 'tasks/'+mid+'/'+ti);
  })).then(function(infos){
    if(!m.tasks[ti].attachments) m.tasks[ti].attachments = [];
    infos.forEach(function(info){
      info.uploadedBy = ST.profile ? ST.profile.name : 'Unknown';
      info.uploadedAt = new Date().toLocaleDateString('en-IN');
      m.tasks[ti].attachments.push(info);
    });
    m.tasks[ti].lastUpdatedBy = ST.profile.name;
    return saveMeeting(m);
  }).then(function(){
    toast('Proof attached!','ok');
    return loadMeetings();
  }).then(function(){ render(); })
  .catch(function(err){ toast('Upload failed: '+err.message,'err'); });
};

window.saveTask = function(i){
  var m=ST.cur; if(!m||!m.tasks[i]) return;
  var as=document.getElementById('ta-'+i);
  var ds=document.getElementById('td-'+i);
  var ss=document.getElementById('ts-'+i);
  var cs=document.getElementById('tc-'+i);

'+t.minute+'

window.saveMyTask = function(mid,ti){
  var m=ST.meetings.find(function(x){return x.id===mid;}); if(!m) return;
  var ss=document.getElementById('mts-'+mid+'-'+ti);
  var cs=document.getElementById('mtc-'+mid+'-'+ti);
  var prevStatus=m.tasks[ti].status;
  m.tasks[ti].status=ss.value;
  if(cs&&cs.value.trim()) m.tasks[ti].lastComment=cs.value.trim();
  m.tasks[ti].lastUpdatedBy=ST.profile.name;
  saveMeeting(m).then(function(){
    toast('Status updated to "'+ss.value+'"!','ok');
    if(ss.value==='completed'&&prevStatus!=='completed'){
      var mgrs=getMgrEmails();
      if(mgrs.length){
        var subj='[NTF MeetTrack] ✅ Task Completed — '+(m.teamName||m.clientName);
        var body='Dear Manager,\n\n'+ST.profile.name+' has completed a task.\n\nMeeting: '+(m.teamName||m.clientName)+'\nDate: '+m.date+'\n\nTask:\n'+m.tasks[ti].minute+'\n\nCompleted by: '+ST.profile.name+'\nDeadline was: '+fmtD(m.tasks[ti].deadline);
        openGmail(mgrs.join(','),subj,body);
        toast('Managers notified!','ok');
      }
    }
    return loadMeetings();
  }).then(function(){ render(); });
};

// ── MODAL ─────────────────────────────────────
function showModal(title, fields, saveLbl, onSave){
  document.querySelectorAll('.modal-bg').forEach(function(m){ m.remove(); });
  var d=document.createElement('div');
  d.className='modal-bg';
  d.innerHTML='<div class="modal-card"><div class="modal-title">'+title+'</div>'+
  fields.map(function(f){
    return '<div class="modal-field"><label>'+f.l+'</label><input class="inp modal-inp" data-k="'+f.k+'" placeholder="'+(f.ph||'')+'" value="'+(f.v||'')+'" type="'+(f.t||'text')+'"></div>';
  }).join('')+
  '<div class="modal-actions"><button class="btn btn-gy btn-sm" id="modal-cancel">Cancel</button><button class="btn btn-or btn-sm" id="modal-save">'+saveLbl+'</button></div></div>';
  document.body.appendChild(d);
  d.querySelector('#modal-cancel').onclick=function(){ d.remove(); };
  d.querySelector('#modal-save').onclick=function(){
    var v={};
    d.querySelectorAll('.modal-inp').forEach(function(i){ v[i.dataset.k]=i.value.trim(); });
    d.remove(); onSave(v);
  };
  d.onclick=function(e){ if(e.target===d) d.remove(); };
  setTimeout(function(){ var f=d.querySelector('.modal-inp'); if(f) f.focus(); },100);
}
