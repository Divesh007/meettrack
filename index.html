<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTF MeetTrack</title>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-auth-compat.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;font-size:14px;color:#1a1a2e;min-height:100vh}
.btn{display:inline-flex;align-items:center;gap:5px;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;border:none;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-or{background:#e8600a;color:#fff}.btn-nv{background:#0f1535;color:#fff}
.btn-gr{background:#16a34a;color:#fff}.btn-rd{background:#dc2626;color:#fff}
.btn-gy{background:#6b7280;color:#fff}.btn-bl{background:#2563eb;color:#fff}
.btn-pu{background:#7c3aed;color:#fff}
.btn-sm{padding:6px 12px!important;font-size:12px!important}
.btn-xs{padding:4px 9px!important;font-size:11px!important}
.btn-full{width:100%;justify-content:center;padding:13px 16px;font-size:14px}
/* AUTH */
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0f2e,#0f1535);padding:20px}
.auth-box{background:#fff;border-radius:16px;padding:36px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.auth-brand{text-align:center;margin-bottom:24px}
.auth-ntf{font-size:11px;font-weight:700;letter-spacing:3px;color:#e8600a;text-transform:uppercase;margin-bottom:6px}
.auth-logo{font-size:30px;font-weight:700;color:#0f1535}
.auth-logo span{color:#e8600a}
.auth-sub{font-size:13px;color:#888;margin-top:4px}
.role-tabs{display:flex;gap:4px;background:#f5f5f5;padding:4px;border-radius:10px;margin-bottom:20px}
.role-tab{flex:1;padding:9px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:#666;font-family:inherit;transition:all .15s}
.role-tab.active{background:#0f1535;color:#fff;font-weight:700}
.hint{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 13px;font-size:12px;color:#1e40af;margin-bottom:16px;line-height:1.7}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:11px;font-weight:700;color:#374151;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.auth-field input{width:100%;padding:11px 13px;border:2px solid #e5e7eb;border-radius:9px;background:#f9fafb;color:#111;font-size:14px;font-family:inherit}
.auth-field input:focus{outline:none;border-color:#0f1535;background:#fff}
.auth-err{background:#fff5f5;border:1px solid #fca5a5;color:#991b1b;font-size:12px;padding:10px 13px;border-radius:8px;margin-bottom:14px}
.auth-link{text-align:center;font-size:13px;color:#777;margin-top:14px}
.auth-link span{color:#e8600a;cursor:pointer;font-weight:700;text-decoration:underline}
/* LAYOUT */
.app-layout{display:flex;min-height:100vh}
.sidebar{width:210px;background:#0f1535;display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:50}
.sb-brand{padding:18px 14px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-ntf{font-size:9px;font-weight:700;letter-spacing:2.5px;color:#e8600a;text-transform:uppercase;margin-bottom:4px}
.sb-name{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.3px}
.sb-name span{color:#e8600a}
.sb-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px}
.sb-section{font-size:9px;font-weight:700;color:rgba(255,255,255,.3);padding:12px 14px 3px;text-transform:uppercase;letter-spacing:1.5px}
.nav-item{padding:10px 14px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.55);border-left:3px solid transparent;display:flex;align-items:center;gap:9px;font-weight:500;transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(232,96,10,.15);color:#fff;border-left-color:#e8600a;font-weight:600}
.sb-user{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:9px}
.sb-av{width:34px;height:34px;border-radius:9px;background:#e8600a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.sb-uname{font-size:12px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-urole{font-size:10px;color:rgba(255,255,255,.4);text-transform:capitalize}
.sb-logout{width:28px;height:28px;background:rgba(255,255,255,.1);border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.4);font-size:16px;flex-shrink:0;border:none}
.sb-logout:hover{background:rgba(255,255,255,.2);color:#fff}
.main-content{flex:1;margin-left:210px;padding:28px;background:#f0f2f5;min-height:100vh}
/* COMMON */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-size:24px;font-weight:700;color:#0f1535;letter-spacing:-.3px}
.page-sub{font-size:13px;color:#888;margin-top:4px}
.back-link{display:inline-flex;align-items:center;gap:6px;color:#e8600a;cursor:pointer;font-weight:600;font-size:13px;margin-bottom:16px;padding:7px 14px;background:#fff7ed;border-radius:8px;border:1px solid #fed7aa}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:#0f1535;text-transform:uppercase;letter-spacing:.6px}
.card-label::before{content:'';width:3px;height:14px;background:#e8600a;border-radius:2px;flex-shrink:0}
.inp{width:100%;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:8px;background:#f9fafb;color:#111;font-size:13px;font-family:inherit;transition:border-color .2s}
.inp:focus{outline:none;border-color:#0f1535;background:#fff}
select.inp{cursor:pointer}
textarea.inp{resize:none;line-height:1.5}
/* BADGES */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.b-pending{background:#fefce8;color:#854d0e;border:1px solid #fde68a}
.b-ongoing{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.b-completed{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.b-internal{background:#f5f3ff;color:#5b21b6;border:1px solid #ddd6fe}
.b-external{background:#fdf4ff;color:#7e22ce;border:1px solid #e9d5ff}
.b-emp{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;font-size:10px;padding:1px 7px}
.b-ov{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.b-mine{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
/* STATS */
.stats-row{display:grid;gap:12px;margin-bottom:20px}
.stats-4{grid-template-columns:repeat(4,1fr)}
.stat-box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-num{font-size:26px;font-weight:700;color:#0f1535;letter-spacing:-.5px}
.stat-text{font-size:12px;color:#888;margin-top:3px}
/* HOME */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;max-width:600px}
.home-card{background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:20px;cursor:pointer;transition:all .2s}
.home-card:hover{border-color:#e8600a;transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,96,10,.1)}
/* TEAMS */
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.team-card{background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:16px;cursor:pointer;transition:all .15s;position:relative}
.team-card:hover{border-color:#e8600a}
.team-card-actions{position:absolute;top:8px;right:8px;display:none;gap:4px}
.team-card:hover .team-card-actions{display:flex}
/* MEETING LIST */
.mtg-list-item{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .15s;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.mtg-list-item:hover{border-color:#e8600a;box-shadow:0 4px 12px rgba(232,96,10,.1)}
.mtg-icon{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#e8600a,#f09040);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
/* ATTENDEES */
.pills-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:30px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:20px;font-size:12px;font-weight:500}
.pill-x{cursor:pointer;color:#9ca3af;font-weight:700;font-size:13px;line-height:1;margin-left:2px}
.pill-x:hover{color:#dc2626}
/* MINUTES */
.min-item{background:#fff;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px;overflow:hidden}
.min-header{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer}
.min-num{font-size:11px;font-weight:700;color:#e8600a;min-width:20px;flex-shrink:0;margin-top:1px}
.min-text{flex:1;font-size:13px;line-height:1.5;color:#111;font-weight:500}
.min-type-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;flex-shrink:0}
.min-note{background:#f1f5f9;color:#475569}
.min-task{background:#fff7ed;color:#c2410c}
.min-body{padding:0 14px 12px;border-top:1px solid #f3f4f6;margin-top:0}
.min-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.attachment-link{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;font-size:11px;color:#1e40af;text-decoration:none;font-weight:600}
.attachment-link:hover{background:#dbeafe}
/* TASKS */
.task-box{background:#fff;border:1px solid #e5e7eb;border-left:4px solid #cbd5e1;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.task-box.mine{border-left-color:#16a34a;background:#f9fffe}
.task-box.overdue{border-left-color:#dc2626;background:#fff9f9}
.task-tags{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.task-desc{font-size:13px;color:#374151;line-height:1.5;margin-bottom:13px;padding:10px 13px;background:#f8fafc;border-radius:8px;border-left:3px solid #e8600a;font-weight:500}
.task-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.field-label{font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.task-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid #f3f4f6;align-items:center}
.task-note{font-size:11px;color:#555;padding:7px 11px;background:#f8fafc;border-radius:7px;margin-top:6px;border-left:2px solid #e8600a;line-height:1.4}
/* CLIENTS */
.client-row{background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .15s;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.client-row:hover{border-color:#e8600a}
.client-av{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#e8600a,#f09040);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
/* MY TASKS */
.task-filter-tabs{display:flex;gap:8px;margin-bottom:18px}
.tftab{padding:8px 20px;border:2px solid #e5e7eb;border-radius:20px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#555;font-family:inherit;transition:all .15s}
.tftab.on{background:#0f1535;color:#fff;border-color:#0f1535}
.tftab.or.on{background:#e8600a;border-color:#e8600a}
.tftab.gr.on{background:#16a34a;border-color:#16a34a}
.section-heading{font-size:12px;font-weight:700;color:#0f1535;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 10px;padding-bottom:7px;border-bottom:2px solid #e5e7eb}
/* DASHBOARD */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-chip{padding:6px 16px;border:2px solid #e5e7eb;border-radius:20px;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#555;font-family:inherit;transition:all .15s}
.filter-chip.active{background:#0f1535;color:#fff;border-color:#0f1535}
.table-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
table{width:100%;border-collapse:collapse}
th{padding:11px 13px;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;background:#f9fafb;border-bottom:1px solid #f3f4f6;text-align:left;letter-spacing:.5px}
td{padding:11px 13px;border-bottom:1px solid #f9fafb;font-size:12px;color:#111;vertical-align:middle}
tr:last-child td{border:none}
tr:hover td{background:#fafafa}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,40,.65);display:flex;align-items:center;justify-content:center;z-index:9999}
.modal-card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:440px;box-shadow:0 24px 64px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:700;color:#0f1535;margin-bottom:16px}
.modal-field{margin-bottom:13px}
.modal-field label{display:block;font-size:11px;font-weight:700;color:#374151;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.modal-actions{display:flex;gap:9px;margin-top:18px;justify-content:flex-end}
/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:11px;font-size:13px;font-weight:600;z-index:99999;animation:toastIn .2s ease;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px}
.toast-ok{background:#166534}.toast-err{background:#991b1b}.toast-inf{background:#1e40af}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0f1535}
.loader{width:40px;height:40px;border:4px solid rgba(232,96,10,.2);border-top-color:#e8600a;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* UPLOAD */
.file-upload-area{border:2px dashed #e5e7eb;border-radius:8px;padding:12px 16px;text-align:center;cursor:pointer;transition:all .15s;background:#f9fafb}
.file-upload-area:hover{border-color:#e8600a;background:#fff7ed}
.file-upload-area input{display:none}
/* VIEW ONLY */
.view-only-banner{background:#fefce8;border:1px solid #fde68a;border-radius:8px;padding:8px 14px;font-size:12px;color:#854d0e;margin-bottom:12px;font-weight:600;display:flex;align-items:center;gap:6px}
@media print{.sidebar,.btn,.back-link,.task-actions,.team-card-actions,.filter-bar,.page-head .btn,.min-actions{display:none!important}.main-content{margin-left:0!important}}
</style>
</head>
<body>
<div id="root">
  <div class="loading-screen">
    <div class="loader"></div>
    <div style="color:rgba(255,255,255,.5);font-size:14px">Loading NTF MeetTrack...</div>
  </div>
</div>
<script>
// ── FIREBASE CONFIG ─────────────────────────────
var firebaseConfig = {
  apiKey: "AIzaSyAlr2Rn4cGBKfMM9mcgKJ3H9rj9tPW5kD0",
  authDomain: "meettrack-1bd7e.firebaseapp.com",
  projectId: "meettrack-1bd7e",
  storageBucket: "meettrack-1bd7e.firebasestorage.app",
  messagingSenderId: "199366587854",
  appId: "1:199366587854:web:3a94a783f60a6e28fbe79f"
};
firebase.initializeApp(firebaseConfig);
var auth    = firebase.auth();
var db      = firebase.firestore();


// ── STATE ───────────────────────────────────────
var ST = {
  page:'loading', subPage:'teams', user:null, profile:null,
  aMode:'login', aRole:'employee', aErr:'',
  allUsers:[], teams:[], clients:[], meetings:[],
  cur:null, curTeamId:null, curClientId:null,
  dFil:'all', dPer:'monthly', myTaskFilter:'all'
};

// ── HELPERS ─────────────────────────────────────
function ini(n){ return (n||'?').split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2); }
function today(){ return new Date().toISOString().split('T')[0]; }
function fmtD(d){ if(!d) return 'Not set'; try{ return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return d; } }
function isOv(d,s){ return d && s!=='completed' && new Date(d) < new Date(); }
function canM(){ return ST.profile && (ST.profile.role==='director'||ST.profile.role==='boss'); }
function canEditMeeting(m){ return m && (m.createdByUid===ST.user.uid || canM()); }
function getMgrEmails(){ return ST.allUsers.filter(function(u){return u.role==='boss'||u.role==='director';}).map(function(u){return u.email;}).filter(Boolean); }
function getAttendeeOptions(m){
  var atts = m && m.attendees ? m.attendees : [];
  return atts.map(function(a){
    return '<option value="'+a.email+'">'+a.name+'</option>';
  }).join('');
}

function toast(msg, type){
  type = type||'inf';
  document.querySelectorAll('.toast').forEach(function(t){ t.remove(); });
  var el = document.createElement('div');
  el.className = 'toast toast-'+type;
  el.innerHTML = (type==='ok'?'✓':type==='err'?'✕':'ℹ')+' '+msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3000);
}
function openGmail(to, subject, body){
  window.open('https://mail.google.com/mail/?view=cm&to='+encodeURIComponent(to)+'&su='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body),'_blank');
}

// ── FIREBASE ────────────────────────────────────
function loadAll(){ return Promise.all([loadUsers(),loadTeams(),loadClients(),loadMeetings()]); }

function loadUsers(){
  return db.collection('users').get().then(function(snap){
    ST.allUsers = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
  });
}
function loadTeams(){
  return db.collection('teams').get().then(function(snap){
    ST.teams = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
    if(!ST.teams.length) return seedTeams();
  });
}
function seedTeams(){
  var defs=[{name:'HR',icon:'👥'},{name:'Tech',icon:'💻'},{name:'Operations',icon:'⚙️'},{name:'Marketing',icon:'📣'},{name:'Finance',icon:'💰'},{name:'Legal',icon:'⚖️'}];
  return Promise.all(defs.map(function(t){
    return db.collection('teams').add(t).then(function(r){ ST.teams.push(Object.assign({id:r.id},t)); });
  }));
}
function loadClients(){
  return db.collection('clients').get().then(function(snap){
    ST.clients = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
  });
}
function loadMeetings(){
  return db.collection('meetings').orderBy('createdAt','desc').get().then(function(snap){
    ST.meetings = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
  }).catch(function(){
    return db.collection('meetings').get().then(function(snap){
      ST.meetings = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
    });
  });
}
function saveMeeting(m){
  var data = JSON.parse(JSON.stringify(m));
  var id = data.id; delete data.id;
  if(id){
    return db.collection('meetings').doc(id).update(data).then(function(){
      m.id=id;
      var idx=ST.meetings.findIndex(function(x){return x.id===id;});
      if(idx!==-1) ST.meetings[idx]=JSON.parse(JSON.stringify(m));
    }).catch(function(){
      return db.collection('meetings').doc(id).set(data).then(function(){ m.id=id; });
    });
  } else {
    data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    return db.collection('meetings').add(data).then(function(r){
      m.id=r.id;
      ST.meetings.unshift(JSON.parse(JSON.stringify(m)));
    });
  }
}
function uploadFile(file, path){
  // Store as base64 in Firestore - no Firebase Storage needed
  return new Promise(function(resolve, reject){
    if(file.size > 900000){
      reject(new Error('File too large. Max size is 900KB. Use a smaller file.'));
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e){
      // Returns base64 data URL - works as download/view link directly
      resolve(e.target.result);
    };
    reader.onerror = function(){ reject(new Error('Could not read file')); };
    reader.readAsDataURL(file);
  });
}

// Download or view a base64 file
// Global handler for attachment buttons (avoids quote issues in onclick)
window._dlAtt = function(btn){
  var url = decodeURIComponent(btn.getAttribute('data-url')||'');
  var name = decodeURIComponent(btn.getAttribute('data-name')||'attachment');
  downloadFile(url, name);
};

function downloadFile(url, name){
  if(!url) return;
  if(url.startsWith('data:image')){
    // Open images in new tab
    var w = window.open('','_blank');
    if(w) w.document.write('<html><head><title>'+name+'</title></head><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="'+url+'" style="max-width:100%;max-height:100vh;object-fit:contain"></body></html>');
  } else {
    // Download other files (PDF, Excel, Word etc)
    var a = document.createElement('a');
    a.href = url;
    a.download = name || 'attachment';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}

window.forgotPassword = function(){
  // Show a small input to enter email
  document.querySelectorAll('.modal-bg').forEach(function(m){m.remove();});
  var d = document.createElement('div');
  d.className = 'modal-bg';
  d.innerHTML =
    '<div class="modal-card" style="max-width:380px">' +
    '<div class="modal-title">Reset Password</div>' +
    '<p style="font-size:13px;color:#6b7280;margin-bottom:16px">Enter your email address and we will send you a link to reset your password.</p>' +
    '<div class="modal-field"><label>Email Address</label><input class="inp" id="fp-email" type="email" placeholder="your@email.com"></div>' +
    '<div id="fp-msg" style="display:none;padding:10px 13px;border-radius:8px;font-size:12px;margin-bottom:10px"></div>' +
    '<div class="modal-actions">' +
    '<button class="btn btn-gy btn-sm" id="fp-cancel">Cancel</button>' +
    '<button class="btn btn-or btn-sm" id="fp-send">Send Reset Link</button>' +
    '</div></div>';
  document.body.appendChild(d);
  d.querySelector('#fp-cancel').onclick = function(){ d.remove(); };
  d.onclick = function(e){ if(e.target===d) d.remove(); };
  setTimeout(function(){ var f=d.querySelector('#fp-email'); if(f) f.focus(); }, 100);

  d.querySelector('#fp-send').onclick = function(){
    var email = (d.querySelector('#fp-email')||{}).value||'';
    email = email.trim();
    var msg = d.querySelector('#fp-msg');
    var btn = d.querySelector('#fp-send');

    if(!email){
      msg.style.display='block';
      msg.style.background='#fff5f5';
      msg.style.border='1px solid #fca5a5';
      msg.style.color='#991b1b';
      msg.textContent='Please enter your email address.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending...';

    auth.sendPasswordResetEmail(email).then(function(){
      msg.style.display = 'block';
      msg.style.background = '#f0fdf4';
      msg.style.border = '1px solid #bbf7d0';
      msg.style.color = '#166534';
      msg.innerHTML = '✓ Reset link sent to <strong>'+email+'</strong><br><span style="font-size:11px">Check your inbox and spam folder.</span>';
      btn.style.display = 'none';
      d.querySelector('#fp-cancel').textContent = 'Close';
    }).catch(function(e){
      msg.style.display = 'block';
      msg.style.background = '#fff5f5';
      msg.style.border = '1px solid #fca5a5';
      msg.style.color = '#991b1b';
      msg.textContent = e.code==='auth/user-not-found'
        ? 'No account found with this email.'
        : e.code==='auth/invalid-email'
        ? 'Please enter a valid email address.'
        : e.message;
      btn.disabled = false;
      btn.textContent = 'Send Reset Link';
    });
  };
};

window.switchAuth=function(){ST.aMode=ST.aMode==='login'?'register':'login';ST.aErr='';render();};
window.doAuth=function(){
  var email=(document.getElementById('a-email')||{}).value||'';
  var pass=(document.getElementById('a-pass')||{}).value||'';
  email=email.trim();
  var btn=document.querySelector('.btn-full');
  if(btn){btn.disabled=true;btn.textContent='Please wait...';}
  if(ST.aMode==='login'){
    auth.signInWithEmailAndPassword(email,pass).then(function(cred){
      return db.collection('users').doc(cred.user.uid).get().then(function(snap){
        if(!snap.exists||snap.data().role!==ST.aRole){
          return auth.signOut().then(function(){ST.aErr='No '+ST.aRole+' account found. Check role or credentials.';render();});
        }
      });
    }).catch(function(e){
      ST.aErr=e.code==='auth/user-not-found'?'Account not found':e.code==='auth/wrong-password'?'Incorrect password':e.code==='auth/invalid-credential'?'Invalid email or password':e.code==='auth/too-many-requests'?'Too many attempts. Try later.':e.message;
      render();
    });
  } else {
    var nameEl=document.getElementById('a-name');
    var name=nameEl?nameEl.value.trim():'';
    if(!name){ST.aErr='Enter your full name';render();return;}
    auth.createUserWithEmailAndPassword(email,pass).then(function(cred){
      return db.collection('users').doc(cred.user.uid).set({name:name,email:email,role:'employee',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    }).catch(function(e){
      ST.aErr=e.code==='auth/email-already-in-use'?'Email already registered':e.code==='auth/weak-password'?'Password must be 6+ chars':e.message;
      render();
    });
  }
};

// ── MY TASKS PAGE ─────────────────────────────────
function myTasksPage(){
  var me=ST.profile&&ST.profile.email;
  var all=[];
  ST.meetings.forEach(function(m){
    (m.minutes||[]).forEach(function(mn,i){
      if(mn.type==='assign'&&mn.task&&mn.task.assigneeEmail===me){
        all.push(Object.assign({},mn.task,{
          mi:i, mid:m.id,
          minuteText:mn.text,
          ref:m.type==='internal'?m.teamName:m.clientName,
          meetingName:m.meetingName||'Untitled',
          mtype:m.type, date:m.date,
          attachmentUrl:mn.attachmentUrl||null,
          attachmentName:mn.attachmentName||null
        }));
      }
    });
  });

  // Filter
  var filt=ST.myTaskFilter;
  var filtered=filt==='all'?all:all.filter(function(t){return t.status===filt;});

  function tCard(t){
    var ov=isOv(t.deadline,t.status);
    return '<div class="task-box mine'+(ov?' overdue':'')+'" style="margin-bottom:14px">'+
    '<div class="task-tags">'+
    '<span class="badge '+(t.mtype==='internal'?'b-internal':'b-external')+'">'+t.ref+'</span>'+
    '<span style="font-size:11px;color:#888;background:#f3f4f6;padding:2px 9px;border-radius:20px">'+t.meetingName+'</span>'+
    '<span style="font-size:11px;color:#aaa;padding:2px 9px">'+t.date+'</span>'+
    (ov?'<span class="b-ov">⚠ Overdue</span>':'')+
    '<span class="badge '+(t.status==='pending'?'b-pending':t.status==='ongoing'?'b-ongoing':'b-completed')+'" style="margin-left:auto">'+t.status.toUpperCase()+'</span>'+
    '</div>'+
    '<div class="task-desc">'+t.minuteText+'</div>'+
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">'+
    '<span style="font-size:13px;color:#374151;font-weight:500">📅 Deadline: <strong style="color:'+(ov?'#991b1b':'#0f1535')+'">'+fmtD(t.deadline)+'</strong></span>'+
    '<select class="inp" id="mts-'+t.mid+'-'+t.mi+'" style="width:150px;font-size:12px">'+
    '<option value="pending"'+(t.status==='pending'?' selected':'')+'>Pending</option>'+
    '<option value="ongoing"'+(t.status==='ongoing'?' selected':'')+'>Ongoing</option>'+
    '<option value="completed"'+(t.status==='completed'?' selected':'')+'>Completed</option>'+
    '</select>'+
    '</div>'+
    '<textarea class="inp" id="mtc-'+t.mid+'-'+t.mi+'" placeholder="Add a comment or update..." style="height:46px;font-size:12px;margin-bottom:10px">'+(t.lastComment||'')+'</textarea>'+
    (t.lastComment?'<div class="task-note" style="margin-bottom:10px">"'+t.lastComment+'" — <em>'+(t.lastUpdatedBy||'?')+'</em></div>':'')+
    '<div style="margin-bottom:10px">'+
    '<div class="field-label" style="margin-bottom:5px">📎 Attach Proof / Evidence</div>'+
    '<div class="file-upload-area" onclick="document.getElementById(\'proof-'+t.mid+'-'+t.mi+'\').click()">'+
    '<input type="file" id="proof-'+t.mid+'-'+t.mi+'" accept="*/*" onchange="previewProof(this,\'proof-lbl-'+t.mid+'-'+t.mi+'\')">'+
    '<div id="proof-lbl-'+t.mid+'-'+t.mi+'" style="font-size:12px;color:#6b7280">'+
    (t.attachmentUrl?'<button onclick="window._dlAtt(this)" data-url="'+encodeURIComponent(t.attachmentUrl||'')+'" data-name="'+encodeURIComponent(t.attachmentName||'attachment')+'" class="attachment-link" style="cursor:pointer;border:none">📎 '+(t.attachmentName||'View File')+'</button> &nbsp; <span style="font-size:11px;color:#888">Click to replace</span>':'Click to attach proof file')+

// Send Gmail for task in meeting room
window.sendTaskGmail = function(minIdx){
  var m = ST.cur;
  if(!m) return;
  var mn = m.minutes[minIdx];
  if(!mn||!mn.task||!mn.task.assigneeEmail){ toast('No assignee on this task','err'); return; }
  var t = mn.task;
  var ref = m.meetingName||(m.type==='internal'?m.teamName:m.clientName)||'Meeting';
  var subject = '[NTF MeetTrack] Task Assigned — '+ref;
  var body = 'Dear '+t.assignee+',\n\nYou have been assigned a task:\n\nMeeting: '+ref+'\nDate: '+m.date+'\n\nTask:\n'+mn.text+'\n\nDeadline: '+fmtD(t.deadline)+'\nStatus: '+t.status+'\nAssigned by: '+ST.profile.name+'\n\nPlease log in to NTF MeetTrack to update your task status.\n\nRegards,\n'+ST.profile.name+'\nNTF India';
  openGmail(t.assigneeEmail, subject, body);
  toast('Opening Gmail for '+t.assignee+'...','ok');
};

// Send Gmail update from My Tasks page
window.sendMyUpdateGmail = function(mid, mi){
  var m = ST.meetings.find(function(x){return x.id===mid;});
  if(!m) return;
  var mn = m.minutes[mi];
  if(!mn||!mn.task){ toast('Task not found','err'); return; }
  var t = mn.task;
  var ref = m.meetingName||(m.type==='internal'?m.teamName:m.clientName)||'Meeting';
  var mgrs = getMgrEmails();
  var ss = document.getElementById('mts-'+mid+'-'+mi);
  var cs = document.getElementById('mtc-'+mid+'-'+mi);
  var currentStatus = ss ? ss.value : t.status;
  var currentComment = cs ? cs.value.trim() : t.lastComment;
  var to = mgrs.length ? mgrs.join(',') : '';
  if(!to){ toast('No managers found to notify','err'); return; }
  var subject = '[NTF MeetTrack] Task Update — '+ref;
  var body = 'Dear Manager,\n\n'+ST.profile.name+' has sent a task update:\n\nMeeting: '+ref+'\nDate: '+m.date+'\n\nTask:\n'+mn.text+'\n\nStatus: '+currentStatus+'\nDeadline: '+fmtD(t.deadline)+(currentComment?'\nNote: "'+currentComment+'"':'')+'\n\nNTF India MeetTrack';
  openGmail(to, subject, body);
  toast('Opening Gmail to notify managers...','ok');
};

  '<div class="filter-bar"><span style="font-size:12px;font-weight:700;color:#6b7280;margin-right:5px">FILTER TASKS:</span>'+
  ['all','pending','ongoing','completed'].map(function(f){return '<button class="filter-chip'+(ST.dFil===f?' active':'')+'" onclick="ST.dFil=\''+f+'\';render()">'+f[0].toUpperCase()+f.slice(1)+'</button>';}).join('')+'</div>'+

  ft.map(function(t,i){var ov2=isOv(t.deadline,t.status);return '<tr>'+

// New Meeting
window.newMeeting=function(){
  showModal('New Meeting',[
    {k:'meetingName',l:'Meeting Name',ph:'e.g. Weekly Sync, Sprint Review'}
  ],'Create Meeting',function(v){
    if(!v.meetingName){toast('Enter meeting name','err');return;}
    var isI=ST.page==='meetlist-int';
    var m;
    if(isI){
      var team=ST.teams.find(function(t){return t.id===ST.curTeamId;});
      m={type:'internal',teamId:team.id,teamName:team.name,meetingName:v.meetingName,
         date:today(),attendees:[{name:ST.profile.name,email:ST.profile.email}],
         minutes:[],tasks:[],createdBy:ST.profile.name,createdByUid:ST.user.uid};
    } else {
      var cl=ST.clients.find(function(c){return c.id===ST.curClientId;});
      m={type:'external',clientId:cl.id,clientName:cl.name,clientContact:cl.contact,
         meetingName:v.meetingName,date:today(),
         attendees:[{name:ST.profile.name,email:ST.profile.email}],
         minutes:[],tasks:[],createdBy:ST.profile.name,createdByUid:ST.user.uid};
    }
    saveMeeting(m).then(function(){
      ST.cur=m; ST.page='meeting'; render();
      toast('Meeting "'+v.meetingName+'" created!','ok');
    });
  });
};

// Teams
window.addTeam=function(){
  showModal('Add New Team',[{k:'name',l:'Team Name',ph:'e.g. Design'},{k:'icon',l:'Emoji Icon',ph:'e.g. 🎨',v:'📋'}],'Add Team',function(v){
    if(!v.name){toast('Enter team name','err');return;}
    db.collection('teams').add({name:v.name,icon:v.icon||'📋'}).then(function(r){
      ST.teams.push({id:r.id,name:v.name,icon:v.icon||'📋'});
      toast('Team "'+v.name+'" added!','ok');render();
    });
  });
};
window.editTeam=function(id){
  var t=ST.teams.find(function(x){return x.id===id;});
  showModal('Edit Team',[{k:'name',l:'Team Name',v:t.name},{k:'icon',l:'Emoji Icon',v:t.icon}],'Update',function(v){
    if(!v.name) return;
    db.collection('teams').doc(id).update({name:v.name,icon:v.icon||t.icon}).then(function(){
      var i=ST.teams.findIndex(function(x){return x.id===id;});
      ST.teams[i]=Object.assign({},ST.teams[i],{name:v.name,icon:v.icon||t.icon});
      ST.meetings.filter(function(m){return m.teamId===id;}).forEach(function(m){m.teamName=v.name;});
      toast('Team updated!','ok');render();
    });
  });
};
window.delTeam=function(id){
  if(!confirm('Delete this team?')) return;
  db.collection('teams').doc(id).delete().then(function(){
    ST.teams=ST.teams.filter(function(t){return t.id!==id;});
    toast('Team deleted','ok');render();
  });
};

// Clients
window.addClient=function(){
  showModal('Add New Client',[{k:'name',l:'Company Name',ph:'e.g. Acme Corporation'},{k:'contact',l:'Contact Email',ph:'contact@company.com'}],'Add Client',function(v){
    if(!v.name||!v.contact){toast('Fill both fields','err');return;}
    db.collection('clients').add({name:v.name,contact:v.contact,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(r){
      ST.clients.push({id:r.id,name:v.name,contact:v.contact});
      toast('Client "'+v.name+'" added!','ok');render();
    });
  });
};
window.delClient=function(id){
  if(!confirm('Delete this client?')) return;
  db.collection('clients').doc(id).delete().then(function(){
    ST.clients=ST.clients.filter(function(c){return c.id!==id;});
    toast('Client deleted','ok');render();
  });
};

// Attendees
window.quickAddAtt=function(email,name){
  if(!ST.cur) return;
  if(!ST.cur.attendees) ST.cur.attendees=[];
  if(ST.cur.attendees.find(function(a){return a.email===email;})){toast('Already added','inf');return;}
  ST.cur.attendees.push({name:name,email:email});

};
window.removeAtt=function(i){
  if(!ST.cur) return;
  ST.cur.attendees.splice(i,1);
  saveMeeting(ST.cur).then(function(){render();});
};
window.addAtt=function(){
  var n=(document.getElementById('att-name')||{}).value||'';
  var e=(document.getElementById('att-email')||{}).value||'';
  n=n.trim();e=e.trim();
  if(!n||!e){toast('Enter both name and email','err');return;}

window.previewProof=function(inp,lblId){

// Add Minute
window.addMinute=function(){
  var text=(document.getElementById('min-input')||{}).value||'';
  text=text.trim();
  if(!text){toast('Type the minute text first','err');return;}
  var typeEl=document.querySelector('input[name="mintype"]:checked');
  var type=typeEl?typeEl.value:'note';
  var fileInput=document.getElementById('min-file');
  var file=fileInput&&fileInput.files[0]?fileInput.files[0]:null;

  var minObj={text:text,type:type,createdBy:ST.profile.name,createdByUid:ST.user.uid};

  if(type==='assign'){
    var asel=document.getElementById('min-assignee');
    var dsel=document.getElementById('min-deadline');
    var ssel=document.getElementById('min-status');
    var assigneeEmail=asel?asel.value:'';
    var assigneeName=asel&&asel.selectedIndex>0?asel.options[asel.selectedIndex].text:'';
    if(!assigneeEmail){toast('Select a person to assign','err');return;}
    minObj.task={assignee:assigneeName,assigneeEmail:assigneeEmail,deadline:dsel?dsel.value:'',status:ssel?ssel.value:'pending',lastUpdatedBy:'',lastComment:''};
  }

  function doSave(url,name){
    if(url){minObj.attachmentUrl=url;minObj.attachmentName=name;}
    if(!ST.cur.minutes) ST.cur.minutes=[];
    ST.cur.minutes.push(minObj);
    saveMeeting(ST.cur).then(function(){toast('Minute added!','ok');render();});
  }

  if(file){
    toast('Processing file...','inf');
    uploadFile(file,'').then(function(url){doSave(url,file.name);}).catch(function(e){toast(e.message,'err');});
  } else {
    doSave(null,null);
  }
};

// Delete Minute
window.delMinute=function(i){
  if(!confirm('Delete this minute?')) return;
  ST.cur.minutes.splice(i,1);
  saveMeeting(ST.cur).then(function(){render();});
};

// Edit Minute
window.editMinute=function(i){
  var mn=ST.cur.minutes[i];
  var atts=ST.cur.attendees||[];
  var attOpts=atts.map(function(a){return '<option value="'+a.email+'"'+(mn.task&&mn.task.assigneeEmail===a.email?' selected':'')+'>'+a.name+'</option>';}).join('');

  var d=document.createElement('div');d.className='modal-bg';
  d.innerHTML='<div class="modal-card">'+
  '<div class="modal-title">Edit Minute</div>'+
  '<div class="modal-field"><label>Minute Text</label><textarea class="inp" id="edit-min-text" style="height:80px">'+mn.text+'</textarea></div>'+
  (mn.type==='assign'?
  '<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:12px;margin-bottom:10px">'+
  '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px">'+
  '<div><div class="field-label" style="margin-bottom:5px">Assign To</div><select class="inp" id="edit-assignee"><option value="">Select</option>'+attOpts+'</select></div>'+
  '<div><div class="field-label" style="margin-bottom:5px">Deadline</div><input type="date" class="inp" id="edit-deadline" value="'+(mn.task&&mn.task.deadline||'')+'"></div>'+
  '<div><div class="field-label" style="margin-bottom:5px">Status</div><select class="inp" id="edit-status"><option value="pending"'+(mn.task&&mn.task.status==='pending'?' selected':'')+'>Pending</option><option value="ongoing"'+(mn.task&&mn.task.status==='ongoing'?' selected':'')+'>Ongoing</option><option value="completed"'+(mn.task&&mn.task.status==='completed'?' selected':'')+'>Completed</option></select></div>'+
  '</div></div>':'')+ 
  '<div class="modal-actions"><button class="btn btn-gy btn-sm" id="ec">Cancel</button><button class="btn btn-or btn-sm" id="es">Save Changes</button></div>'+
  '</div>';
  document.body.appendChild(d);
  d.querySelector('#ec').onclick=function(){d.remove();};
  d.querySelector('#es').onclick=function(){
    var newText=(document.getElementById('edit-min-text')||{}).value||'';
    newText=newText.trim();
    if(!newText){toast('Text cannot be empty','err');return;}
    ST.cur.minutes[i].text=newText;
    if(mn.type==='assign'&&mn.task){
      var asel=document.getElementById('edit-assignee');
      var dsel=document.getElementById('edit-deadline');
      var ssel=document.getElementById('edit-status');
      if(asel){ST.cur.minutes[i].task.assigneeEmail=asel.value;var opt=asel.options[asel.selectedIndex];ST.cur.minutes[i].task.assignee=opt&&opt.value?opt.text:'';}
      if(dsel) ST.cur.minutes[i].task.deadline=dsel.value;
      if(ssel) ST.cur.minutes[i].task.status=ssel.value;
      ST.cur.minutes[i].task.lastUpdatedBy=ST.profile.name;
    }
    d.remove();
    saveMeeting(ST.cur).then(function(){toast('Minute updated!','ok');render();});
  };
  d.onclick=function(e){if(e.target===d)d.remove();};
};

// Save My Task
window.saveMyTask=function(mid,mi){
  var m=ST.meetings.find(function(x){return x.id===mid;}); if(!m) return;
  var ss=document.getElementById('mts-'+mid+'-'+mi);
  var cs=document.getElementById('mtc-'+mid+'-'+mi);
  var fileInput=document.getElementById('proof-'+mid+'-'+mi);
  var file=fileInput&&fileInput.files[0]?fileInput.files[0]:null;
  var prevStatus=m.minutes[mi].task.status;
  m.minutes[mi].task.status=ss.value;
  if(cs&&cs.value.trim()) m.minutes[mi].task.lastComment=cs.value.trim();
  m.minutes[mi].task.lastUpdatedBy=ST.profile.name;

  function doSave(url,name){
    if(url){m.minutes[mi].attachmentUrl=url;m.minutes[mi].attachmentName=name;}
    saveMeeting(m).then(function(){
      toast('Status updated to "'+ss.value+'"!','ok');
      if(ss.value==='completed'&&prevStatus!=='completed'){
        var mgrs=getMgrEmails();
        if(mgrs.length){
          var subj='[NTF MeetTrack] ✅ Task Completed — '+(m.meetingName||m.teamName||m.clientName);
          var body='Dear Manager,\n\n'+ST.profile.name+' has completed a task.\n\nMeeting: '+(m.meetingName||'Untitled')+'\nTask: '+m.minutes[mi].text+'\nCompleted by: '+ST.profile.name+'\nDeadline was: '+fmtD(m.minutes[mi].task.deadline);
          openGmail(mgrs.join(','),subj,body);
          toast('Managers notified!','ok');
        }
      }
      return loadMeetings();
    }).then(function(){render();});
  }

  if(file){
    toast('Processing proof...','inf');
    var path='proofs/'+mid+'/'+Date.now()+'_'+file.name;
    uploadFile(file,'').then(function(url){doSave(url,file.name);}).catch(function(e){toast(e.message,'err');});
  } else {
    doSave(null,null);
  }
};

// Delete Meeting
window.delMtg=function(id){
  if(!confirm('Delete this meeting permanently?')) return;
  db.collection('meetings').doc(id).delete().then(function(){
    ST.meetings=ST.meetings.filter(function(m){return m.id!==id;});
    toast('Meeting deleted','ok');render();
  });
};

// ── EXPORT PDF ──────────────────────────────────
window.exportPDF=function(){
  if(typeof window.jspdf==='undefined'){toast('PDF library loading...','inf');return;}
  var doc=new window.jspdf.jsPDF();
  var m=ST.cur;
  var y=20;
  doc.setFontSize(18);doc.setTextColor(14,27,62);
  doc.text('NTF MeetTrack - Minutes of Meeting',14,y);y+=10;
  doc.setFontSize(12);doc.setTextColor(100,100,100);
  doc.text('Meeting: '+(m.meetingName||'Untitled'),14,y);y+=7;
  doc.text('Type: '+m.type+' | Reference: '+(m.teamName||m.clientName),14,y);y+=7;
  doc.text('Date: '+m.date+' | Created by: '+m.createdBy,14,y);y+=7;
  doc.text('Attendees: '+(m.attendees||[]).map(function(a){return a.name;}).join(', '),14,y);y+=12;
  doc.setFontSize(14);doc.setTextColor(14,27,62);
  doc.text('Minutes:',14,y);y+=8;
  (m.minutes||[]).forEach(function(mn,i){
    doc.setFontSize(12);doc.setTextColor(50,50,50);
    var txt=(i+1)+'. ['+(mn.type==='assign'?'TASK':'NOTE')+'] '+mn.text;
    var lines=doc.splitTextToSize(txt,180);
    if(y+lines.length*7>280){doc.addPage();y=20;}
    doc.text(lines,14,y);y+=lines.length*7;
    if(mn.type==='assign'&&mn.task){
      doc.setFontSize(10);doc.setTextColor(100,100,100);
      doc.text('   Assigned to: '+(mn.task.assignee||'-')+' | Deadline: '+fmtD(mn.task.deadline)+' | Status: '+mn.task.status,14,y);y+=6;
    }
    y+=3;
  });
  doc.save((m.meetingName||'meeting')+'_minutes.pdf');
  toast('PDF downloaded!','ok');
};

// ── EXPORT EXCEL (CSV) ──────────────────────────
window.exportExcel=function(){
  var m=ST.cur;
  var rows=[['#','Type','Minute','Assigned To','Deadline','Status','Comment']];
  (m.minutes||[]).forEach(function(mn,i){
    rows.push([
      i+1,
      mn.type==='assign'?'TASK':'NOTE',
      '"'+(mn.text||'').replace(/"/g,'""')+'"',
      mn.task?mn.task.assignee||'-':'-',
      mn.task?fmtD(mn.task.deadline):'-',
      mn.task?mn.task.status:'-',
      mn.task?'"'+(mn.task.lastComment||'').replace(/"/g,'""')+'"':'-'
    ]);
  });
  var csv=rows.map(function(r){return r.join(',');}).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=(m.meetingName||'meeting')+'_minutes.csv';a.click();
  URL.revokeObjectURL(url);
  toast('Excel/CSV downloaded!','ok');
};

// ── MODAL ────────────────────────────────────────
function showModal(title,fields,saveLbl,onSave){
  document.querySelectorAll('.modal-bg').forEach(function(m){m.remove();});
  var d=document.createElement('div');d.className='modal-bg';
  d.innerHTML='<div class="modal-card"><div class="modal-title">'+title+'</div>'+
  fields.map(function(f){
    return '<div class="modal-field"><label>'+f.l+'</label><input class="inp modal-inp" data-k="'+f.k+'" placeholder="'+(f.ph||'')+'" value="'+(f.v||'')+'" type="'+(f.t||'text')+'"></div>';
  }).join('')+
  '<div class="modal-actions"><button class="btn btn-gy btn-sm" id="modal-cancel">Cancel</button><button class="btn btn-or btn-sm" id="modal-save">'+saveLbl+'</button></div></div>';
  document.body.appendChild(d);
  d.querySelector('#modal-cancel').onclick=function(){d.remove();};
  d.querySelector('#modal-save').onclick=function(){
    var v={};d.querySelectorAll('.modal-inp').forEach(function(i){v[i.dataset.k]=i.value.trim();});
    d.remove();onSave(v);
  };
  d.onclick=function(e){if(e.target===d)d.remove();};
  setTimeout(function(){var f=d.querySelector('.modal-inp');if(f)f.focus();},100);
}
</script>
